version: 1.1

source: ontology.quotetobooking.fact_bookings

comment: Sales bookings and revenue analytics metric view for completed booking transactions across customers, products, partners, geographies, sales representatives, contracts, and reporting periods. Grain is one row per booked order line.

dimensions:
  - name: booking_id
    expr: booking_id
    comment: Unique identifier for an individual booking transaction record.
    display_name: Booking ID

  - name: order_number
    expr: order_number
    comment: Sales order number associated with the booking transaction.
    display_name: Order Number

  - name: order_line_number
    expr: order_line_number
    comment: Line number within the sales order representing the booked item or service.
    display_name: Order Line Number

  - name: booking_type
    expr: booking_type
    comment: Type of booking event, such as new business or renewal.
    display_name: Booking Type
    synonyms:
      - booking event type
      - transaction type

  - name: is_renewal
    expr: is_renewal
    comment: Indicator showing whether the booking transaction is a renewal (1 = renewal, 0 = new).
    display_name: Renewal Indicator
    synonyms:
      - renewal flag

  - name: quantity
    expr: quantity
    comment: Number of units, licenses, or services booked in the transaction.
    display_name: Quantity Sold

  - name: unit_list_price_usd
    expr: unit_list_price_usd
    comment: Standard list price per unit in US dollars before discounts.
    display_name: Unit List Price (USD)

  - name: discount_pct
    expr: discount_pct
    comment: Discount applied to the booked item or service, stored as a fractional percentage of list price.
    display_name: Discount Percentage

  - name: customer_id
    expr: customer.customer_id
    comment: Business identifier assigned to the customer account.
    display_name: Customer ID

  - name: customer_name
    expr: customer.customer_name
    comment: Official name of the customer organization.
    display_name: Customer Name

  - name: segment
    expr: customer.segment
    comment: Market segment the customer belongs to, such as Enterprise, Service Provider, or Public Sector.
    display_name: Customer Segment
    synonyms:
      - market segment

  - name: industry
    expr: customer.industry
    comment: Industry classification of the customer organization.
    display_name: Industry

  - name: account_tier
    expr: customer.account_tier
    comment: Strategic importance or service tier assigned to the customer account.
    display_name: Account Tier

  - name: hq_country
    expr: customer.hq_country
    comment: Country where the customer organization's headquarters is located.
    display_name: Headquarters Country

  - name: hq_region
    expr: customer.hq_region
    comment: Broad geographic region of the customer organization's headquarters.
    display_name: Headquarters Region

  - name: product_id
    expr: product.product_id
    comment: Business identifier or SKU assigned to the product or offer.
    display_name: Product ID
    synonyms:
      - SKU

  - name: product_name
    expr: product.product_name
    comment: Descriptive name of the product or service offering.
    display_name: Product Name

  - name: product_family
    expr: product.product_family
    comment: Higher-level grouping of related products within the portfolio.
    display_name: Product Family

  - name: technology_domain
    expr: product.technology_domain
    comment: Technology area or solution domain the product belongs to.
    display_name: Technology Domain

  - name: offer_type
    expr: product.offer_type
    comment: Commercial offer classification, such as hardware, software subscription, or SaaS subscription.
    display_name: Offer Type

  - name: business_entity
    expr: product.business_entity
    comment: Internal business portfolio or organizational unit associated with the product.
    display_name: Business Entity

  - name: partner_id
    expr: partner.partner_id
    comment: Business identifier assigned to the partner organization.
    display_name: Partner ID

  - name: partner_name
    expr: partner.partner_name
    comment: Official name of the partner organization.
    display_name: Partner Name

  - name: partner_type
    expr: partner.partner_type
    comment: Classification of the partner, such as distributor, reseller, systems integrator, or direct channel.
    display_name: Partner Type

  - name: partner_tier
    expr: partner.partner_tier
    comment: Program tier or status level assigned to the partner.
    display_name: Partner Tier

  - name: route_to_market
    expr: partner.route_to_market
    comment: Sales channel path through which the product or service is sold to the customer.
    display_name: Route to Market
    synonyms:
      - sales channel

  - name: region
    expr: geography.region
    comment: High-level geographic region used for sales reporting, such as Americas, EMEA, or APJC.
    display_name: Sales Region
    synonyms:
      - geographic region

  - name: theater
    expr: geography.theater
    comment: Intermediate sales territory grouping within a region.
    display_name: Sales Theater

  - name: country
    expr: geography.country
    comment: Country associated with the geography record.
    display_name: Country

  - name: rep_id
    expr: sales_rep.rep_id
    comment: Business identifier assigned to the sales representative.
    display_name: Sales Rep ID

  - name: rep_name
    expr: sales_rep.rep_name
    comment: Full name of the sales representative.
    display_name: Sales Rep Name

  - name: sales_role
    expr: sales_rep.sales_role
    comment: Job role or selling responsibility of the sales representative.
    display_name: Sales Role

  - name: sales_team
    expr: sales_rep.sales_team
    comment: Team or organizational unit the sales representative belongs to.
    display_name: Sales Team

  - name: segment_covered
    expr: sales_rep.segment_covered
    comment: Customer segment or market segment covered by the sales representative.
    display_name: Segment Covered

  - name: contract_type
    expr: contract.contract_type
    comment: Type of commercial agreement or support entitlement, such as Enterprise Agreement, SaaS Subscription, or Solution Support.
    display_name: Contract Type

  - name: term_months
    expr: contract.term_months
    comment: Number of months covered by the contract or subscription term.
    display_name: Contract Term (Months)

  - name: auto_renew_flag
    expr: contract.auto_renew_flag
    comment: Indicator showing whether the contract is set to renew automatically at the end of its term (Y = yes, N = no).
    display_name: Auto Renewal Flag

  - name: coverage_level
    expr: contract.coverage_level
    comment: Service or support coverage level provided under the contract.
    display_name: Coverage Level

  - name: full_date
    expr: dates.full_date
    comment: Actual calendar date represented by the date record.
    display_name: Booking Date

  - name: month_name
    expr: dates.month_name
    comment: Name of the calendar month for the date.
    display_name: Month Name

  - name: calendar_year
    expr: dates.calendar_year
    comment: Calendar year associated with the date.
    display_name: Calendar Year

  - name: fiscal_year
    expr: dates.fiscal_year
    comment: Fiscal year used for financial and sales reporting.
    display_name: Fiscal Year

  - name: fiscal_quarter
    expr: dates.fiscal_quarter
    comment: Fiscal quarter used for period-based reporting and analysis.
    display_name: Fiscal Quarter

  - name: fiscal_period_seq
    expr: dates.fiscal_period_seq
    comment: Sequential number representing the fiscal reporting period in order.
    display_name: Fiscal Period Sequence

measures:
  - name: booking_count
    expr: COUNT(booking_id)
    comment: Count of booking transaction records.
    display_name: Booking Count
    synonyms:
      - number of bookings
      - booking transactions

  - name: distinct_order_count
    expr: COUNT(DISTINCT order_number)
    comment: Count of distinct sales orders associated with booking transactions.
    display_name: Distinct Order Count
    synonyms:
      - unique orders

  - name: total_quantity
    expr: SUM(quantity)
    comment: Total number of units, licenses, or services booked.
    display_name: Total Quantity
    synonyms:
      - total units sold

  - name: total_booking_amount_usd
    expr: SUM(booking_amount_usd)
    comment: Total booked sales amount in US dollars after pricing and discount adjustments.
    display_name: Total Booking Amount (USD)
    synonyms:
      - total bookings
      - booking revenue

  - name: total_acv_usd
    expr: SUM(acv_usd)
    comment: Total annual contract value in US dollars.
    display_name: Total ACV (USD)
    synonyms:
      - annual contract value
      - total ACV

  - name: total_tcv_usd
    expr: SUM(tcv_usd)
    comment: Total contract value in US dollars.
    display_name: Total TCV (USD)
    synonyms:
      - total contract value
      - total TCV

  - name: average_discount_pct
    expr: AVG(discount_pct)
    comment: Average discount applied to booked items or services, stored as a fractional percentage.
    display_name: Average Discount Percentage
    synonyms:
      - average discount

  - name: average_selling_price_usd
    expr: SUM(booking_amount_usd) / NULLIF(SUM(quantity), 0)
    comment: Average booked revenue per unit sold in US dollars.
    display_name: Average Selling Price (USD)
    synonyms:
      - ASP
      - average unit price

  - name: renewal_booking_amount_usd
    expr: SUM(CASE WHEN is_renewal = 1 THEN booking_amount_usd ELSE 0 END)
    comment: Total booked sales amount in US dollars for renewal transactions.
    display_name: Renewal Booking Amount (USD)
    synonyms:
      - renewal revenue

  - name: net_new_booking_amount_usd
    expr: SUM(CASE WHEN is_renewal = 0 THEN booking_amount_usd ELSE 0 END)
    comment: Total booked sales amount in US dollars for non-renewal transactions.
    display_name: Net New Booking Amount (USD)
    synonyms:
      - new business revenue

  - name: average_booking_value_usd
    expr: SUM(booking_amount_usd) / NULLIF(COUNT(DISTINCT booking_id), 0)
    comment: Average booking value in US dollars per distinct booking transaction.
    display_name: Average Booking Value (USD)
    synonyms:
      - average deal size

joins:
  - name: customer
    source: ontology.quotetobooking.dim_customer
    on: source.customer_key = customer.customer_key

  - name: product
    source: ontology.quotetobooking.dim_product
    on: source.product_key = product.product_key

  - name: partner
    source: ontology.quotetobooking.dim_partner
    on: source.partner_key = partner.partner_key

  - name: geography
    source: ontology.quotetobooking.dim_geography
    on: source.geography_key = geography.geography_key

  - name: sales_rep
    source: ontology.quotetobooking.dim_sales_rep
    on: source.sales_rep_key = sales_rep.sales_rep_key

  - name: contract
    source: ontology.quotetobooking.dim_contract
    on: source.contract_key = contract.contract_key

  - name: dates
    source: ontology.quotetobooking.dim_date
    on: source.date_key = dates.date_key
