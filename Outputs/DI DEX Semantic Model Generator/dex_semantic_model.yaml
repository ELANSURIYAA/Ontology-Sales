version: "1.0"

semantic_model:
  - name: customer_experience_semantic_model
    description: >-
      Comprehensive semantic model for Customer Experience analytics covering customer relationships,
      sales transactions, product inventory, shipment logistics, marketing campaigns, and employee management.
      This model supports end-to-end analysis of customer journeys, order fulfillment, product performance,
      supplier reliability, and campaign effectiveness.
    
    ai_context:
      instructions: >-
        ## Dataset Grain Guide
        
        - **customers**: One row per customer. Use for customer-level analysis and aggregations.
        - **orders**: One row per order. Use for order-level revenue, cost, and profitability analysis.
        - **order_items**: One row per order line item (product within an order). Use for product-level sales analysis.
        - **products**: One row per product. Use for product catalog and pricing analysis.
        - **product_categories**: One row per product category. Supports hierarchical category analysis via parent_category_id.
        - **campaigns**: One row per marketing campaign. Use for campaign performance analysis.
        - **employees**: One row per employee. Supports hierarchical organization analysis via manager_id.
        - **customer_account_managers**: One row per customer-account manager assignment with temporal validity (SCD Type-2). Multiple rows may exist for the same customer across different time periods.
        - **stores**: One row per store location.
        - **suppliers**: One row per supplier.
        - **shipments**: One row per shipment from supplier to store.
        - **shipment_items**: One row per product within a shipment.
        - **exchange_rates**: One row per currency per date. Use for as-of date currency conversion.
        
        ## Measure Selection by Grain
        
        **Order-Level Revenue Analysis:**
        - Use `orders.total_amount_usd` when analyzing revenue at order level
        - Use `orders.total_cost_usd` when analyzing cost at order level
        - Do NOT sum order-level measures after joining to order_items (causes duplication)
        
        **Order-Item-Level Revenue Analysis:**
        - Use `order_items.line_revenue_usd` when analyzing revenue by product or order line
        - Use `order_items.line_cost_usd` when analyzing cost by product or order line
        - These measures are safe to aggregate at product, category, or order-item level
        
        **Shipment-Level Analysis:**
        - Use `shipments.freight_cost_usd` for shipment cost analysis
        - Do NOT sum after joining to shipment_items
        
        ## Join Guidance
        
        **Standard Relationships:**
        - orders → customers: Use orders.customer_id = customers.customer_id
        - orders → stores: Use orders.store_id = stores.store_id
        - order_items → orders: Use order_items.order_id = orders.order_id
        - order_items → products: Use order_items.product_id = products.product_id
        - products → product_categories: Use products.category_id = product_categories.category_id
        - products → suppliers: Use products.supplier_id = suppliers.supplier_id
        - shipments → suppliers: Use shipments.supplier_id = suppliers.supplier_id
        - shipments → stores: Use shipments.store_id = stores.store_id
        - shipment_items → shipments: Use shipment_items.shipment_id = shipments.shipment_id
        - shipment_items → products: Use shipment_items.product_id = products.product_id
        
        **Temporal SCD Type-2 Relationship (customer_account_managers):**
        - To find the account manager for a customer at a specific point in time, use:
          ```
          customer_account_managers.customer_id = customers.customer_id
          AND <reference_date> >= customer_account_managers.valid_from
          AND (<reference_date> < customer_account_managers.valid_to OR customer_account_managers.valid_to IS NULL)
          ```
        - For order analysis, use orders.order_date as the reference date
        - Multiple assignment records may exist for the same customer across different validity periods
        
        **As-Of Date Relationship (exchange_rates):**
        - To convert order amounts using the exchange rate effective on the order date:
          ```
          exchange_rates.currency_code = orders.currency_code
          AND exchange_rates.rate_date = (
            SELECT MAX(er2.rate_date)
            FROM exchange_rates er2
            WHERE er2.currency_code = orders.currency_code
            AND er2.rate_date <= orders.order_date::date
          )
          ```
        - This ensures the most recent exchange rate on or before the order date is used
        
        **Recursive Hierarchy (employees):**
        - employees.manager_id references employees.employee_id
        - Use recursive CTE to traverse the management hierarchy:
          ```
          WITH RECURSIVE emp_hierarchy AS (
            SELECT employee_id, employee_name, manager_id, 1 as level
            FROM employees
            WHERE manager_id IS NULL
            UNION ALL
            SELECT e.employee_id, e.employee_name, e.manager_id, eh.level + 1
            FROM employees e
            INNER JOIN emp_hierarchy eh ON e.manager_id = eh.employee_id
          )
          SELECT * FROM emp_hierarchy
          ```
        
        **Recursive Hierarchy (product_categories):**
        - product_categories.parent_category_id references product_categories.category_id
        - Use recursive CTE to traverse the category hierarchy:
          ```
          WITH RECURSIVE cat_hierarchy AS (
            SELECT category_id, category_name, parent_category_id, 1 as level
            FROM product_categories
            WHERE parent_category_id IS NULL
            UNION ALL
            SELECT c.category_id, c.category_name, c.parent_category_id, ch.level + 1
            FROM product_categories c
            INNER JOIN cat_hierarchy ch ON c.parent_category_id = ch.category_id
          )
          SELECT * FROM cat_hierarchy
          ```
        
        ## Double-Counting Prevention
        
        **Critical: Order-Level vs Order-Item-Level Measures**
        - `orders.total_amount_usd` is an order-level measure
        - When joining orders to order_items, each order row duplicates for each order item
        - NEVER sum `orders.total_amount_usd` after joining to order_items
        - Instead, use `order_items.line_revenue_usd` for product-level revenue analysis
        - If you must analyze order-level revenue with product dimensions, use a subquery or window function to deduplicate
        
        **Shipment-Level Measures**
        - `shipments.freight_cost_usd` is a shipment-level measure
        - Do NOT sum after joining to shipment_items
        - Use aggregation at shipment level or deduplicate using DISTINCT ON or window functions
        
        ## Time Analysis
        
        **Order Analysis:**
        - Use `orders.order_date` for order placement time analysis
        - Supports daily, monthly, quarterly, and yearly aggregation
        
        **Customer Signup Analysis:**
        - Use `customers.signup_date` for customer acquisition time analysis
        
        **Campaign Analysis:**
        - Use `campaigns.start_date` and `campaigns.end_date` for campaign period analysis
        
        **Shipment Analysis:**
        - Use `shipments.ship_date` for shipment departure analysis
        - Use `shipments.expected_arrival` and `shipments.actual_arrival` for delivery performance analysis
        
        **Employee Analysis:**
        - Use `employees.hire_date` for employee tenure analysis
        
        **Exchange Rate Analysis:**
        - Use `exchange_rates.rate_date` for currency rate time series
        
        ## Query Restrictions and Guidance
        
        **Currency Conversion:**
        - Order amounts are stored in both USD (`total_amount_usd`) and local currency (`local_amount`)
        - The `currency_code` field indicates the local currency
        - For multi-currency analysis, use the as-of exchange rate relationship
        
        **Returned Orders:**
        - Use `orders.is_returned` to filter or segment returned vs completed orders
        - Returned orders should be excluded from net revenue calculations or analyzed separately
        
        **Order Status:**
        - Use `orders.order_status` to filter orders by fulfillment stage
        - Common values include: Placed, Shipped, Delivered, Cancelled
        
        **Shipment Status:**
        - Use `shipments.shipment_status` to filter shipments by delivery stage
        - Common values include: In Transit, Delivered, Delayed
        
        **Customer Segmentation:**
        - Use `customers.customer_segment` for segment-based analysis
        - Use `campaigns.target_segment` to analyze campaign targeting effectiveness
        
        **Product Hierarchy:**
        - Products belong to categories via `products.category_id`
        - Categories may have parent categories via `product_categories.parent_category_id`
        - Use recursive queries to analyze product performance across category hierarchies
        
        **Employee Hierarchy:**
        - Employees report to managers via `employees.manager_id`
        - Use recursive queries to analyze team structures, span of control, and organizational depth
        
        **Delivery Performance:**
        - Compare `shipments.expected_arrival` with `shipments.actual_arrival` to measure delivery accuracy
        - Calculate delay as: `actual_arrival - expected_arrival`
        - NULL `actual_arrival` indicates shipment has not yet arrived
        
        **Discount Analysis:**
        - Order-item-level discounts are in `order_items.discount_pct`
        - Campaign-level discounts are in `campaigns.discount_pct`
        - Line revenue already reflects applied discounts
        
        **Supplier Reliability:**
        - Use `suppliers.reliability_score` to analyze supplier performance
        - Combine with shipment delivery performance for comprehensive supplier analysis
    
    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Customer master dataset containing one row per customer. Stores comprehensive customer profiles
          including contact details, location, segment classification, and signup information. This is the
          primary dimension for customer-level analysis and aggregations.
        source: semantic.customers
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: Unique identifier for a customer. Primary key.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: first_name
            business_name: First Name
            description: Given name of the customer. PII field.
            sql_type: VARCHAR(50)
            constraints:
              - NOT NULL
          
          - name: last_name
            business_name: Last Name
            description: Family name of the customer. PII field.
            sql_type: VARCHAR(50)
            constraints:
              - NOT NULL
          
          - name: email
            business_name: Email
            description: Email address used to contact the customer. PII field. Must be unique.
            sql_type: VARCHAR(150)
            constraints:
              - NOT NULL
              - UNIQUE
          
          - name: phone
            business_name: Phone
            description: Primary phone number of the customer. PII field.
            sql_type: VARCHAR(20)
          
          - name: city
            business_name: City
            description: City where the customer is located. Geographic dimension for customer analysis.
            sql_type: VARCHAR(80)
            dimension:
              is_geographic: true
          
          - name: country
            business_name: Country
            description: Country where the customer is located. Geographic dimension for customer analysis.
            sql_type: VARCHAR(80)
            dimension:
              is_geographic: true
          
          - name: customer_segment
            business_name: Customer Segment
            description: >-
              Segment classification assigned to the customer. Business dimension for customer segmentation
              analysis. Default value is 'Regular'.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT 'Regular'
            dimension:
              is_categorical: true
          
          - name: signup_date
            business_name: Signup Date
            description: >-
              Date when the customer registered or signed up. Time dimension for customer acquisition analysis.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the customer record was created in the system.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: orders
        business_name: Orders
        description: >-
          Order transaction dataset containing one row per customer order. Records end-to-end sales transactions
          including order dates, customer references, store references, payment details, order status, and
          monetary amounts. This is the primary fact table for order-level revenue, cost, and profitability analysis.
          IMPORTANT: Order-level measures (total_amount_usd, total_cost_usd) should NOT be summed after joining
          to order_items to avoid double-counting.
        source: semantic.orders
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: Unique identifier for a customer order. Primary key.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: customer_id
            business_name: Customer Reference
            description: References the customer who placed the order. Foreign key to customers.customer_id.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: store_id
            business_name: Store Reference
            description: References the store fulfilling the order. Foreign key to stores.store_id.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: order_date
            business_name: Order Date
            description: >-
              Timestamp when the order was placed. Primary time dimension for order analysis.
              Use for daily, monthly, quarterly, and yearly sales aggregation.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: order_channel
            business_name: Order Channel
            description: >-
              Channel through which the order was placed (e.g., Web, Mobile, Phone, Store).
              Business dimension for channel analysis. Default value is 'Web'.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT 'Web'
            dimension:
              is_categorical: true
          
          - name: payment_method
            business_name: Payment Method
            description: >-
              Method used by the customer to pay for the order (e.g., Credit Card, PayPal, Cash).
              Business dimension for payment analysis. Default value is 'Credit Card'.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT 'Credit Card'
            dimension:
              is_categorical: true
          
          - name: order_status
            business_name: Order Status
            description: >-
              Current status of the order (e.g., Placed, Shipped, Delivered, Cancelled).
              Business dimension for order lifecycle analysis. Default value is 'Placed'.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT 'Placed'
            dimension:
              is_categorical: true
          
          - name: is_returned
            business_name: Is Returned
            description: >-
              Boolean indicator of whether the order has been returned. Use to filter or segment
              returned vs completed orders. Default value is false.
            sql_type: BOOL
            constraints:
              - NOT NULL
              - DEFAULT false
            dimension:
              is_categorical: true
          
          - name: customer_rating
            business_name: Customer Rating
            description: >-
              Rating provided by the customer for the order experience. Numeric measure for
              customer satisfaction analysis.
            sql_type: INT2
          
          - name: currency_code
            business_name: Currency Code
            description: >-
              Currency code used for the order amounts (ISO 3-letter code). Default value is 'USD'.
              Used for multi-currency analysis and exchange rate lookups.
            sql_type: VARCHAR(3)
            constraints:
              - NOT NULL
              - DEFAULT 'USD'
            dimension:
              is_categorical: true
          
          - name: total_amount_usd
            business_name: Total Amount USD
            description: >-
              Total order amount in USD. Order-level revenue measure. CRITICAL: Do NOT sum this measure
              after joining to order_items as it will cause double-counting. Use order_items.line_revenue_usd
              for product-level revenue analysis.
            sql_type: NUMERIC(12,2)
            constraints:
              - NOT NULL
          
          - name: local_amount
            business_name: Local Amount
            description: Total order amount in the local currency specified by currency_code.
            sql_type: NUMERIC(14,2)
            constraints:
              - NOT NULL
          
          - name: total_cost_usd
            business_name: Total Cost USD
            description: >-
              Total cost of fulfilling the order in USD. Order-level cost measure. CRITICAL: Do NOT sum
              this measure after joining to order_items as it will cause double-counting. Use
              order_items.line_cost_usd for product-level cost analysis.
            sql_type: NUMERIC(12,2)
            constraints:
              - NOT NULL
      
      - name: order_items
        business_name: Order Items
        description: >-
          Order line item dataset containing one row per product within an order. Records detailed
          line-level information including product references, quantities, unit prices, unit costs,
          discounts, and calculated line revenue and cost. This is the primary fact table for
          product-level sales analysis. Use this dataset when analyzing revenue or cost by product,
          category, or order line.
        source: semantic.order_items
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: Unique identifier for an order line item. Primary key.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: order_id
            business_name: Order Reference
            description: References the related order record. Foreign key to orders.order_id.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: product_id
            business_name: Product Reference
            description: References the product included in the order item. Foreign key to products.product_id.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: Number of units of the product ordered. Quantitative measure for volume analysis.
            sql_type: INT4
            constraints:
              - NOT NULL
          
          - name: unit_price_usd
            business_name: Unit Price USD
            description: Selling price per unit in USD. Use for pricing analysis.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: unit_cost_usd
            business_name: Unit Cost USD
            description: Cost per unit in USD. Use for cost analysis and margin calculations.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: discount_pct
            business_name: Discount Percentage
            description: >-
              Percentage discount applied to the order item. Default value is 10.00.
              Use for discount effectiveness analysis.
            sql_type: NUMERIC(5,2)
            constraints:
              - NOT NULL
              - DEFAULT 10.00
          
          - name: line_revenue_usd
            business_name: Line Revenue USD
            description: >-
              Calculated revenue for the order item line in USD after discounts. Computed field.
              Formula: quantity * unit_price_usd * (1 - discount_pct / 100.0).
              This is the primary revenue measure for product-level analysis.
            sql_type: NUMERIC(12,2)
            constraints:
              - COMPUTED
          
          - name: line_cost_usd
            business_name: Line Cost USD
            description: >-
              Calculated cost for the order item line in USD. Computed field.
              Formula: quantity * unit_cost_usd.
              This is the primary cost measure for product-level analysis.
            sql_type: NUMERIC(12,2)
            constraints:
              - COMPUTED
      
      - name: products
        business_name: Products
        description: >-
          Product master dataset containing one row per product. Contains product catalog information
          including product names, category assignments, supplier references, unit costs, unit prices,
          and creation timestamps. This is the primary dimension for product-level analysis.
        source: semantic.products
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: Unique identifier for a product. Primary key.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: product_name
            business_name: Product Name
            description: Name or title of the product. Business dimension for product identification.
            sql_type: VARCHAR(150)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: category_id
            business_name: Category Reference
            description: >-
              References the category to which the product belongs. Foreign key to
              product_categories.category_id.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: unit_cost_usd
            business_name: Unit Cost USD
            description: Cost to acquire or produce one unit of the product in USD. Use for cost analysis.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: unit_price_usd
            business_name: Unit Price USD
            description: Selling price per unit of the product in USD. Use for pricing analysis.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: supplier_id
            business_name: Supplier Reference
            description: References the supplier providing the product. Foreign key to suppliers.supplier_id.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the product record was created in the system.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: product_categories
        business_name: Product Categories
        description: >-
          Product category master dataset containing one row per product category. Supports hierarchical
          category structures via parent_category_id self-reference. Use recursive queries to traverse
          the category hierarchy for multi-level product analysis.
        source: semantic.product_categories
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: Unique identifier for a product category. Primary key.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: category_name
            business_name: Category Name
            description: Name of the product category. Business dimension for category-level analysis.
            sql_type: VARCHAR(100)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: parent_category_id
            business_name: Parent Category Reference
            description: >-
              References the parent category in the hierarchy. Self-referencing foreign key to
              product_categories.category_id. NULL indicates a top-level category. Use recursive
              CTE to traverse the category hierarchy.
            sql_type: INT4
            constraints:
              - FOREIGN KEY (SELF-REFERENCE)
      
      - name: campaigns
        business_name: Campaigns
        description: >-
          Marketing campaign master dataset containing one row per marketing campaign. Records campaign
          details including campaign names, marketing channels, target customer segments, campaign periods,
          and discount offerings. Use for campaign performance and effectiveness analysis.
        source: semantic.campaigns
        primary_key:
          - campaign_id
        fields:
          - name: campaign_id
            business_name: Campaign Identifier
            description: Unique identifier for a marketing campaign. Primary key.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: campaign_name
            business_name: Campaign Name
            description: Name of the marketing campaign. Business dimension for campaign identification.
            sql_type: VARCHAR(120)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: channel
            business_name: Channel
            description: >-
              Marketing channel used to run the campaign (e.g., Email, Social Media, TV, Print).
              Business dimension for channel effectiveness analysis.
            sql_type: VARCHAR(20)
            dimension:
              is_categorical: true
          
          - name: target_segment
            business_name: Target Segment
            description: >-
              Customer segment targeted by the campaign. Business dimension for campaign targeting analysis.
            sql_type: VARCHAR(20)
            dimension:
              is_categorical: true
          
          - name: start_date
            business_name: Start Date
            description: Date when the campaign starts. Time dimension for campaign period analysis.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: end_date
            business_name: End Date
            description: Date when the campaign ends. Time dimension for campaign period analysis.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: discount_pct
            business_name: Discount Percentage
            description: >-
              Percentage discount offered by the campaign. Default value is 15.00.
              Use for campaign discount analysis.
            sql_type: NUMERIC(5,2)
            constraints:
              - NOT NULL
              - DEFAULT 15.00
      
      - name: employees
        business_name: Employees
        description: >-
          Employee master dataset containing one row per employee. Maintains personnel records including
          employee identifiers, names, job roles, manager assignments, regional assignments, and hire dates.
          Supports hierarchical organization structures via manager_id self-reference. Use recursive queries
          to traverse the management hierarchy for organizational analysis.
        source: semantic.employees
        primary_key:
          - employee_id
        fields:
          - name: employee_id
            business_name: Employee Identifier
            description: Unique identifier for an employee. Primary key.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: employee_name
            business_name: Employee Name
            description: Full name of the employee. PII field.
            sql_type: VARCHAR(100)
            constraints:
              - NOT NULL
          
          - name: role
            business_name: Role
            description: >-
              Job role or position of the employee (e.g., Account Manager, Sales Representative, Director).
              Business dimension for role-based analysis.
            sql_type: VARCHAR(40)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: manager_id
            business_name: Manager Reference
            description: >-
              References the employee who manages this employee. Self-referencing foreign key to
              employees.employee_id. NULL indicates a top-level executive with no manager. Use recursive
              CTE to traverse the management hierarchy.
            sql_type: INT4
            constraints:
              - FOREIGN KEY (SELF-REFERENCE)
          
          - name: region
            business_name: Region
            description: >-
              Geographic region assigned to the employee. Business dimension for regional analysis.
            sql_type: VARCHAR(80)
            dimension:
              is_geographic: true
          
          - name: hire_date
            business_name: Hire Date
            description: >-
              Date when the employee was hired. Time dimension for employee tenure analysis.
              Default value is '2023-05-01'.
            sql_type: DATE
            constraints:
              - NOT NULL
              - DEFAULT '2023-05-01'
            dimension:
              is_time: true
      
      - name: customer_account_managers
        business_name: Customer Account Managers
        description: >-
          Customer account manager assignment dataset containing one row per customer-account manager
          assignment with temporal validity. Implements Slowly Changing Dimension Type-2 pattern.
          Multiple assignment records may exist for the same customer across different time periods
          (valid_from to valid_to). Use temporal join logic to find the account manager effective
          at a specific point in time.
        source: semantic.customer_account_managers
        primary_key:
          - assignment_id
        fields:
          - name: assignment_id
            business_name: Assignment Identifier
            description: Unique identifier for a customer account manager assignment. Primary key.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: customer_id
            business_name: Customer Reference
            description: References the related customer record. Foreign key to customers.customer_id.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: employee_id
            business_name: Employee Reference
            description: >-
              References the employee assigned as the account manager. Foreign key to employees.employee_id.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: valid_from
            business_name: Valid From
            description: >-
              Date when the account manager assignment becomes effective. Start of validity period
              for SCD Type-2 temporal analysis.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: valid_to
            business_name: Valid To
            description: >-
              Date when the account manager assignment ends. End of validity period for SCD Type-2
              temporal analysis. NULL indicates the assignment is currently active.
            sql_type: DATE
            dimension:
              is_time: true
      
      - name: stores
        business_name: Stores
        description: >-
          Store master dataset containing one row per store location. Records store details including
          store names, geographic locations, store types, and creation timestamps. This is the primary
          dimension for store-level analysis.
        source: semantic.stores
        primary_key:
          - store_id
        fields:
          - name: store_id
            business_name: Store Identifier
            description: Unique identifier for a store. Primary key.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: store_name
            business_name: Store Name
            description: Name of the store. Business dimension for store identification.
            sql_type: VARCHAR(120)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: city
            business_name: City
            description: City where the store is located. Geographic dimension for store analysis.
            sql_type: VARCHAR(80)
            dimension:
              is_geographic: true
          
          - name: country
            business_name: Country
            description: Country where the store is located. Geographic dimension for store analysis.
            sql_type: VARCHAR(80)
            dimension:
              is_geographic: true
          
          - name: store_type
            business_name: Store Type
            description: >-
              Type or format of the store, such as Physical, Online, or Hybrid. Business dimension
              for store type analysis.
            sql_type: VARCHAR(30)
            dimension:
              is_categorical: true
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the store record was created in the system.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: suppliers
        business_name: Suppliers
        description: >-
          Supplier master dataset containing one row per supplier. Records supplier details including
          supplier names, countries, contact information, reliability scores, and creation timestamps.
          This is the primary dimension for supplier-level analysis.
        source: semantic.suppliers
        primary_key:
          - supplier_id
        fields:
          - name: supplier_id
            business_name: Supplier Identifier
            description: Unique identifier for a supplier. Primary key.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: supplier_name
            business_name: Supplier Name
            description: Name of the supplier organization. Business dimension for supplier identification.
            sql_type: VARCHAR(120)
            constraints:
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: country
            business_name: Country
            description: Country where the supplier is based. Geographic dimension for supplier analysis.
            sql_type: VARCHAR(80)
            dimension:
              is_geographic: true
          
          - name: contact_email
            business_name: Contact Email
            description: Email address for contacting the supplier. PII field.
            sql_type: VARCHAR(150)
          
          - name: reliability_score
            business_name: Reliability Score
            description: >-
              Score indicating the reliability of the supplier (0.00 to 1.00). Default value is 0.95.
              Use for supplier performance analysis.
            sql_type: NUMERIC(3,2)
            constraints:
              - DEFAULT 0.95
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the supplier record was created in the system.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
      
      - name: shipments
        business_name: Shipments
        description: >-
          Shipment transaction dataset containing one row per shipment from supplier to store. Records
          shipment details including supplier references, store references, shipment dates, expected and
          actual arrival dates, freight costs, and shipment status. This is the primary fact table for
          shipment and logistics analysis. IMPORTANT: Shipment-level measures (freight_cost_usd) should
          NOT be summed after joining to shipment_items to avoid double-counting.
        source: semantic.shipments
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: Unique identifier for a shipment. Primary key.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: supplier_id
            business_name: Supplier Reference
            description: >-
              References the supplier responsible for the shipment. Foreign key to suppliers.supplier_id.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: store_id
            business_name: Store Reference
            description: >-
              References the destination store for the shipment. Foreign key to stores.store_id.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: ship_date
            business_name: Ship Date
            description: >-
              Timestamp when the shipment departed. Time dimension for shipment departure analysis.
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: expected_arrival
            business_name: Expected Arrival
            description: >-
              Expected arrival date of the shipment. Use for delivery performance analysis by comparing
              with actual_arrival.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: actual_arrival
            business_name: Actual Arrival
            description: >-
              Actual arrival date of the shipment. NULL indicates shipment has not yet arrived.
              Use for delivery performance analysis by comparing with expected_arrival.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: freight_cost_usd
            business_name: Freight Cost USD
            description: >-
              Freight cost of the shipment in USD. Default value is 250.00. Shipment-level cost measure.
              CRITICAL: Do NOT sum this measure after joining to shipment_items as it will cause
              double-counting.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
              - DEFAULT 250.00
          
          - name: shipment_status
            business_name: Shipment Status
            description: >-
              Current status of the shipment (e.g., In Transit, Delivered, Delayed). Default value is
              'In Transit'. Business dimension for shipment lifecycle analysis.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT 'In Transit'
            dimension:
              is_categorical: true
      
      - name: shipment_items
        business_name: Shipment Items
        description: >-
          Shipment line item dataset containing one row per product within a shipment. Records detailed
          line-level information including shipment references, product references, and quantities.
          Use for product-level shipment and inventory analysis.
        source: semantic.shipment_items
        primary_key:
          - shipment_item_id
        fields:
          - name: shipment_item_id
            business_name: Shipment Item Identifier
            description: Unique identifier for a shipment line item. Primary key.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: shipment_id
            business_name: Shipment Reference
            description: >-
              References the shipment containing the item. Foreign key to shipments.shipment_id.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: product_id
            business_name: Product Reference
            description: >-
              References the product included in the shipment item. Foreign key to products.product_id.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: >-
              Number of units of the product in the shipment item. Quantitative measure for
              shipment volume analysis.
            sql_type: INT4
            constraints:
              - NOT NULL
      
      - name: exchange_rates
        business_name: Exchange Rates
        description: >-
          Exchange rate dataset containing one row per currency per date. Records daily exchange rates
          for currencies against USD. Use as-of date logic to find the exchange rate effective on a
          specific transaction date for multi-currency analysis.
        source: semantic.exchange_rates
        primary_key:
          - currency_code
          - rate_date
        fields:
          - name: currency_code
            business_name: Currency Code
            description: >-
              ISO currency code for the exchange rate (3-letter code). Part of composite primary key.
            sql_type: VARCHAR(3)
            constraints:
              - PRIMARY KEY
              - NOT NULL
            dimension:
              is_categorical: true
          
          - name: rate_date
            business_name: Rate Date
            description: >-
              Date for which the exchange rate applies. Part of composite primary key. Time dimension
              for exchange rate time series analysis.
            sql_type: DATE
            constraints:
              - PRIMARY KEY
              - NOT NULL
            dimension:
              is_time: true
          
          - name: usd_rate
            business_name: USD Rate
            description: >-
              Exchange rate of the currency against USD. Use for currency conversion calculations.
            sql_type: NUMERIC(12,6)
            constraints:
              - NOT NULL
    
    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship. Multiple orders can belong to one customer.
          Join orders.customer_id = customers.customer_id to analyze orders by customer attributes.
      
      - name: orders_to_stores
        left_dataset: orders
        right_dataset: stores
        relationship_type: many_to_one
        join:
          left:
            - store_id
          right:
            - store_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship. Multiple orders can be fulfilled by one store.
          Join orders.store_id = stores.store_id to analyze orders by store location and type.
      
      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship. Multiple order items belong to one order.
          Join order_items.order_id = orders.order_id to analyze order items with order-level attributes.
          CRITICAL: Do NOT sum order-level measures (orders.total_amount_usd, orders.total_cost_usd)
          after this join as it will cause double-counting. Use order_items.line_revenue_usd and
          order_items.line_cost_usd for product-level analysis.
      
      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship. Multiple order items can reference one product.
          Join order_items.product_id = products.product_id to analyze sales by product attributes.
      
      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship. Multiple products belong to one category.
          Join products.category_id = product_categories.category_id to analyze products by category.
      
      - name: products_to_suppliers
        left_dataset: products
        right_dataset: suppliers
        relationship_type: many_to_one
        join:
          left:
            - supplier_id
          right:
            - supplier_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship. Multiple products can be supplied by one supplier.
          Join products.supplier_id = suppliers.supplier_id to analyze products by supplier.
      
      - name: shipments_to_suppliers
        left_dataset: shipments
        right_dataset: suppliers
        relationship_type: many_to_one
        join:
          left:
            - supplier_id
          right:
            - supplier_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship. Multiple shipments can originate from one supplier.
          Join shipments.supplier_id = suppliers.supplier_id to analyze shipments by supplier.
      
      - name: shipments_to_stores
        left_dataset: shipments
        right_dataset: stores
        relationship_type: many_to_one
        join:
          left:
            - store_id
          right:
            - store_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship. Multiple shipments can be delivered to one store.
          Join shipments.store_id = stores.store_id to analyze shipments by destination store.
      
      - name: shipment_items_to_shipments
        left_dataset: shipment_items
        right_dataset: shipments
        relationship_type: many_to_one
        join:
          left:
            - shipment_id
          right:
            - shipment_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship. Multiple shipment items belong to one shipment.
          Join shipment_items.shipment_id = shipments.shipment_id to analyze shipment items with
          shipment-level attributes. CRITICAL: Do NOT sum shipment-level measures
          (shipments.freight_cost_usd) after this join as it will cause double-counting.
      
      - name: shipment_items_to_products
        left_dataset: shipment_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship. Multiple shipment items can reference one product.
          Join shipment_items.product_id = products.product_id to analyze shipments by product.
      
      - name: customer_account_managers_to_customers
        left_dataset: customer_account_managers
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship with temporal validity (SCD Type-2). Multiple assignment
          records can exist for one customer across different time periods. Join
          customer_account_managers.customer_id = customers.customer_id and apply temporal filtering
          using valid_from and valid_to to find the account manager effective at a specific point in time.
      
      - name: customer_account_managers_to_employees
        left_dataset: customer_account_managers
        right_dataset: employees
        relationship_type: many_to_one
        join:
          left:
            - employee_id
          right:
            - employee_id
        join_type: many_to_one
        resolution: >-
          Standard many-to-one relationship. Multiple customer assignments can reference one employee.
          Join customer_account_managers.employee_id = employees.employee_id to analyze account
          manager assignments by employee attributes.
      
      - name: employees_hierarchy
        left_dataset: employees
        right_dataset: employees
        relationship_type: many_to_one
        join:
          left:
            - manager_id
          right:
            - employee_id
        join_type: many_to_one
        resolution: >-
          Recursive self-referencing relationship. Multiple employees report to one manager.
          Join employees.manager_id = manager.employee_id to find direct manager. Use recursive CTE
          to traverse the complete management hierarchy. NULL manager_id indicates top-level executive.
      
      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Recursive self-referencing relationship. Multiple child categories belong to one parent category.
          Join product_categories.parent_category_id = parent.category_id to find direct parent. Use
          recursive CTE to traverse the complete category hierarchy. NULL parent_category_id indicates
          top-level category.
      
      - name: orders_to_customer_account_managers_scd
        left_dataset: orders
        right_dataset: customer_account_managers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
            - order_date
          right:
            - customer_id
            - valid_from
            - valid_to
        join_type: scd_type2_date_range
        resolution: >-
          SCD Type-2 temporal relationship. To find the account manager responsible for a customer at
          the time of order placement, use: customer_account_managers.customer_id = orders.customer_id
          AND orders.order_date::date >= customer_account_managers.valid_from
          AND (orders.order_date::date < customer_account_managers.valid_to OR customer_account_managers.valid_to IS NULL).
          This ensures the correct historical account manager assignment is used based on the order date.
      
      - name: orders_to_exchange_rates_asof
        left_dataset: orders
        right_dataset: exchange_rates
        relationship_type: many_to_one
        join:
          left:
            - currency_code
            - order_date
          right:
            - currency_code
            - rate_date
        join_type: as_of_date
        resolution: >-
          As-of date relationship. To convert order amounts using the exchange rate effective on the
          order date, use: exchange_rates.currency_code = orders.currency_code AND exchange_rates.rate_date =
          (SELECT MAX(er2.rate_date) FROM exchange_rates er2 WHERE er2.currency_code = orders.currency_code
          AND er2.rate_date <= orders.order_date::date). This ensures the most recent exchange rate on or
          before the order date is used for currency conversion.
    
    metrics:
      - name: total_revenue_usd
        business_name: Total Revenue USD
        description: >-
          Total revenue across all orders in USD. Aggregates order-level total_amount_usd.
          Use for overall revenue analysis at order grain.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) AS total_revenue_usd
                FROM semantic.orders AS orders
                WHERE orders.is_returned = false
              columns_used:
                - orders.total_amount_usd
                - orders.is_returned
      
      - name: total_cost_usd
        business_name: Total Cost USD
        description: >-
          Total cost across all orders in USD. Aggregates order-level total_cost_usd.
          Use for overall cost analysis at order grain.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_cost_usd) AS total_cost_usd
                FROM semantic.orders AS orders
                WHERE orders.is_returned = false
              columns_used:
                - orders.total_cost_usd
                - orders.is_returned
      
      - name: gross_profit_usd
        business_name: Gross Profit USD
        description: >-
          Gross profit calculated as total revenue minus total cost in USD.
          Formula: SUM(total_amount_usd) - SUM(total_cost_usd).
          Use for profitability analysis at order grain.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) - SUM(orders.total_cost_usd) AS gross_profit_usd
                FROM semantic.orders AS orders
                WHERE orders.is_returned = false
              columns_used:
                - orders.total_amount_usd
                - orders.total_cost_usd
                - orders.is_returned
      
      - name: gross_margin_pct
        business_name: Gross Margin Percentage
        description: >-
          Gross margin percentage calculated as (gross profit / total revenue) * 100.
          Formula: ((SUM(total_amount_usd) - SUM(total_cost_usd)) / NULLIF(SUM(total_amount_usd), 0)) * 100.
          Safe division handles zero revenue scenarios. Use for profitability rate analysis.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN SUM(orders.total_amount_usd) = 0 THEN 0
                        ELSE
                            (
                                (SUM(orders.total_amount_usd) - SUM(orders.total_cost_usd))
                                / NULLIF(SUM(orders.total_amount_usd), 0)
                            ) * 100
                    END AS gross_margin_pct
                FROM semantic.orders AS orders
                WHERE orders.is_returned = false
              columns_used:
                - orders.total_amount_usd
                - orders.total_cost_usd
                - orders.is_returned
      
      - name: order_count
        business_name: Order Count
        description: >-
          Total count of orders. Use for order volume analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(orders.order_id) AS order_count
                FROM semantic.orders AS orders
                WHERE orders.is_returned = false
              columns_used:
                - orders.order_id
                - orders.is_returned
      
      - name: customer_count
        business_name: Customer Count
        description: >-
          Total count of distinct customers. Use for customer base size analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT customers.customer_id) AS customer_count
                FROM semantic.customers AS customers
              columns_used:
                - customers.customer_id
      
      - name: product_count
        business_name: Product Count
        description: >-
          Total count of distinct products. Use for product catalog size analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT products.product_id) AS product_count
                FROM semantic.products AS products
              columns_used:
                - products.product_id
      
      - name: average_order_value_usd
        business_name: Average Order Value USD
        description: >-
          Average order value calculated as total revenue divided by order count.
          Formula: SUM(total_amount_usd) / NULLIF(COUNT(order_id), 0).
          Use for order size analysis.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) / NULLIF(COUNT(orders.order_id), 0) AS average_order_value_usd
                FROM semantic.orders AS orders
                WHERE orders.is_returned = false
              columns_used:
                - orders.total_amount_usd
                - orders.order_id
                - orders.is_returned
      
      - name: units_sold
        business_name: Units Sold
        description: >-
          Total units sold across all order items. Aggregates order_items.quantity.
          Use for sales volume analysis at product grain.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_items.quantity) AS units_sold
                FROM semantic.order_items AS order_items
                INNER JOIN semantic.orders AS orders
                    ON order_items.order_id = orders.order_id
                WHERE orders.is_returned = false
              columns_used:
                - order_items.quantity
                - order_items.order_id
                - orders.order_id
                - orders.is_returned
      
      - name: product_line_revenue_usd
        business_name: Product Line Revenue USD
        description: >-
          Total revenue at product line level. Aggregates order_items.line_revenue_usd.
          Use for product-level revenue analysis. This is the correct measure for product and
          category analysis (not orders.total_amount_usd which would double-count).
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_items.line_revenue_usd) AS product_line_revenue_usd
                FROM semantic.order_items AS order_items
                INNER JOIN semantic.orders AS orders
                    ON order_items.order_id = orders.order_id
                WHERE orders.is_returned = false
              columns_used:
                - order_items.line_revenue_usd
                - order_items.order_id
                - orders.order_id
                - orders.is_returned
      
      - name: product_line_cost_usd
        business_name: Product Line Cost USD
        description: >-
          Total cost at product line level. Aggregates order_items.line_cost_usd.
          Use for product-level cost analysis. This is the correct measure for product and
          category analysis (not orders.total_cost_usd which would double-count).
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_items.line_cost_usd) AS product_line_cost_usd
                FROM semantic.order_items AS order_items
                INNER JOIN semantic.orders AS orders
                    ON order_items.order_id = orders.order_id
                WHERE orders.is_returned = false
              columns_used:
                - order_items.line_cost_usd
                - order_items.order_id
                - orders.order_id
                - orders.is_returned
      
      - name: product_line_profit_usd
        business_name: Product Line Profit USD
        description: >-
          Gross profit at product line level calculated as line revenue minus line cost.
          Formula: SUM(line_revenue_usd) - SUM(line_cost_usd).
          Use for product-level profitability analysis.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_items.line_revenue_usd) - SUM(order_items.line_cost_usd) AS product_line_profit_usd
                FROM semantic.order_items AS order_items
                INNER JOIN semantic.orders AS orders
                    ON order_items.order_id = orders.order_id
                WHERE orders.is_returned = false
              columns_used:
                - order_items.line_revenue_usd
                - order_items.line_cost_usd
                - order_items.order_id
                - orders.order_id
                - orders.is_returned
      
      - name: average_discount_pct
        business_name: Average Discount Percentage
        description: >-
          Average discount percentage across all order items. Calculated as simple average of discount_pct.
          Use for discount analysis.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(order_items.discount_pct) AS average_discount_pct
                FROM semantic.order_items AS order_items
                INNER JOIN semantic.orders AS orders
                    ON order_items.order_id = orders.order_id
                WHERE orders.is_returned = false
              columns_used:
                - order_items.discount_pct
                - order_items.order_id
                - orders.order_id
                - orders.is_returned
      
      - name: total_freight_cost_usd
        business_name: Total Freight Cost USD
        description: >-
          Total freight cost across all shipments in USD. Aggregates shipments.freight_cost_usd.
          Use for logistics cost analysis at shipment grain.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(shipments.freight_cost_usd) AS total_freight_cost_usd
                FROM semantic.shipments AS shipments
              columns_used:
                - shipments.freight_cost_usd
      
      - name: shipment_count
        business_name: Shipment Count
        description: >-
          Total count of shipments. Use for shipment volume analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(shipments.shipment_id) AS shipment_count
                FROM semantic.shipments AS shipments
              columns_used:
                - shipments.shipment_id
      
      - name: units_shipped
        business_name: Units Shipped
        description: >-
          Total units shipped across all shipment items. Aggregates shipment_items.quantity.
          Use for shipment volume analysis at product grain.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(shipment_items.quantity) AS units_shipped
                FROM semantic.shipment_items AS shipment_items
              columns_used:
                - shipment_items.quantity
      
      - name: average_delivery_delay_days
        business_name: Average Delivery Delay Days
        description: >-
          Average delivery delay in days calculated as actual_arrival minus expected_arrival.
          Only includes shipments that have arrived (actual_arrival IS NOT NULL).
          Positive values indicate late delivery, negative values indicate early delivery.
          Use for delivery performance analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(shipments.actual_arrival - shipments.expected_arrival) AS average_delivery_delay_days
                FROM semantic.shipments AS shipments
                WHERE shipments.actual_arrival IS NOT NULL
              columns_used:
                - shipments.actual_arrival
                - shipments.expected_arrival
      
      - name: on_time_delivery_rate_pct
        business_name: On-Time Delivery Rate Percentage
        description: >-
          Percentage of shipments delivered on or before expected arrival date.
          Formula: (COUNT(shipments where actual_arrival <= expected_arrival) / COUNT(shipments with actual_arrival)) * 100.
          Only includes shipments that have arrived. Use for delivery performance analysis.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    (
                        COUNT(CASE WHEN shipments.actual_arrival <= shipments.expected_arrival THEN 1 END)::DECIMAL
                        / NULLIF(COUNT(CASE WHEN shipments.actual_arrival IS NOT NULL THEN 1 END), 0)
                    ) * 100 AS on_time_delivery_rate_pct
                FROM semantic.shipments AS shipments
              columns_used:
                - shipments.actual_arrival
                - shipments.expected_arrival
      
      - name: orders_per_customer
        business_name: Orders Per Customer
        description: >-
          Average number of orders per customer. Formula: COUNT(orders) / COUNT(DISTINCT customer_id).
          Use for customer purchase frequency analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(orders.order_id)::DECIMAL / NULLIF(COUNT(DISTINCT orders.customer_id), 0) AS orders_per_customer
                FROM semantic.orders AS orders
                WHERE orders.is_returned = false
              columns_used:
                - orders.order_id
                - orders.customer_id
                - orders.is_returned
      
      - name: revenue_per_customer_usd
        business_name: Revenue Per Customer USD
        description: >-
          Average revenue per customer. Formula: SUM(total_amount_usd) / COUNT(DISTINCT customer_id).
          Use for customer value analysis.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) / NULLIF(COUNT(DISTINCT orders.customer_id), 0) AS revenue_per_customer_usd
                FROM semantic.orders AS orders
                WHERE orders.is_returned = false
              columns_used:
                - orders.total_amount_usd
                - orders.customer_id
                - orders.is_returned
      
      - name: average_customer_rating
        business_name: Average Customer Rating
        description: >-
          Average customer rating across all orders. Use for customer satisfaction analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(orders.customer_rating) AS average_customer_rating
                FROM semantic.orders AS orders
                WHERE orders.customer_rating IS NOT NULL
                    AND orders.is_returned = false
              columns_used:
                - orders.customer_rating
                - orders.is_returned
      
      - name: return_rate_pct
        business_name: Return Rate Percentage
        description: >-
          Percentage of orders that have been returned. Formula: (COUNT(returned orders) / COUNT(all orders)) * 100.
          Use for return analysis.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    (
                        COUNT(CASE WHEN orders.is_returned = true THEN 1 END)::DECIMAL
                        / NULLIF(COUNT(orders.order_id), 0)
                    ) * 100 AS return_rate_pct
                FROM semantic.orders AS orders
              columns_used:
                - orders.is_returned
                - orders.order_id
      
      - name: monthly_revenue_usd
        business_name: Monthly Revenue USD
        description: >-
          Total revenue aggregated by month. Uses DATE_TRUNC to group by month.
          Returns one row per month. Use for monthly revenue trend analysis.
        return_type: currency_usd
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', orders.order_date) AS month,
                    SUM(orders.total_amount_usd) AS monthly_revenue_usd
                FROM semantic.orders AS orders
                WHERE orders.is_returned = false
                GROUP BY DATE_TRUNC('month', orders.order_date)
                ORDER BY month
              columns_used:
                - orders.order_date
                - orders.total_amount_usd
                - orders.is_returned
      
      - name: revenue_by_customer_segment_usd
        business_name: Revenue By Customer Segment USD
        description: >-
          Total revenue aggregated by customer segment. Returns one row per segment.
          Use for customer segment performance analysis.
        return_type: currency_usd
        result_grain: one row per customer segment
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    customers.customer_segment,
                    SUM(orders.total_amount_usd) AS revenue_by_segment_usd
                FROM semantic.orders AS orders
                INNER JOIN semantic.customers AS customers
                    ON orders.customer_id = customers.customer_id
                WHERE orders.is_returned = false
                GROUP BY customers.customer_segment
                ORDER BY revenue_by_segment_usd DESC
              columns_used:
                - orders.customer_id
                - orders.total_amount_usd
                - orders.is_returned
                - customers.customer_id
                - customers.customer_segment
      
      - name: revenue_by_product_category_usd
        business_name: Revenue By Product Category USD
        description: >-
          Total revenue aggregated by product category. Returns one row per category.
          Uses product line revenue to avoid double-counting. Use for category performance analysis.
        return_type: currency_usd
        result_grain: one row per product category
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    product_categories.category_name,
                    SUM(order_items.line_revenue_usd) AS revenue_by_category_usd
                FROM semantic.order_items AS order_items
                INNER JOIN semantic.orders AS orders
                    ON order_items.order_id = orders.order_id
                INNER JOIN semantic.products AS products
                    ON order_items.product_id = products.product_id
                INNER JOIN semantic.product_categories AS product_categories
                    ON products.category_id = product_categories.category_id
                WHERE orders.is_returned = false
                GROUP BY product_categories.category_name
                ORDER BY revenue_by_category_usd DESC
              columns_used:
                - order_items.order_id
                - order_items.product_id
                - order_items.line_revenue_usd
                - orders.order_id
                - orders.is_returned
                - products.product_id
                - products.category_id
                - product_categories.category_id
                - product_categories.category_name
      
      - name: revenue_by_order_channel_usd
        business_name: Revenue By Order Channel USD
        description: >-
          Total revenue aggregated by order channel. Returns one row per channel.
          Use for channel performance analysis.
        return_type: currency_usd
        result_grain: one row per order channel
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    orders.order_channel,
                    SUM(orders.total_amount_usd) AS revenue_by_channel_usd
                FROM semantic.orders AS orders
                WHERE orders.is_returned = false
                GROUP BY orders.order_channel
                ORDER BY revenue_by_channel_usd DESC
              columns_used:
                - orders.order_channel
                - orders.total_amount_usd
                - orders.is_returned
      
      - name: top_10_products_by_revenue
        business_name: Top 10 Products By Revenue
        description: >-
          Top 10 products ranked by total revenue. Returns one row per product limited to top 10.
          Use for product performance analysis.
        return_type: currency_usd
        result_grain: one row per product (top 10)
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    products.product_name,
                    SUM(order_items.line_revenue_usd) AS product_revenue_usd
                FROM semantic.order_items AS order_items
                INNER JOIN semantic.orders AS orders
                    ON order_items.order_id = orders.order_id
                INNER JOIN semantic.products AS products
                    ON order_items.product_id = products.product_id
                WHERE orders.is_returned = false
                GROUP BY products.product_name
                ORDER BY product_revenue_usd DESC
                LIMIT 10
              columns_used:
                - order_items.order_id
                - order_items.product_id
                - order_items.line_revenue_usd
                - orders.order_id
                - orders.is_returned
                - products.product_id
                - products.product_name
      
      - name: supplier_reliability_score_avg
        business_name: Average Supplier Reliability Score
        description: >-
          Average reliability score across all suppliers. Use for overall supplier performance analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(suppliers.reliability_score) AS avg_supplier_reliability_score
                FROM semantic.suppliers AS suppliers
              columns_used:
                - suppliers.reliability_score