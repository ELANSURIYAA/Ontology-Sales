version: "1.0"
semantic_model:
  - name: quote_to_booking
    description: Sales bookings and revenue analytics semantic model for completed booking transactions across customers, products, partners, geographies, sales representatives, contracts, and fiscal periods.
    ai_context:
      instructions: >-
        Use this semantic model for sales bookings and revenue analysis. The primary transaction grain is an individual booking transaction record identified by booking_id, with supporting order and order-line attributes. fact_bookings is the transactional dataset and the related dimensions provide descriptive business context for customer, product, partner, geography, sales representative, contract, and date analysis. Use booking_amount_usd for booked revenue analysis, acv_usd for annual contract value analysis, tcv_usd for total contract value analysis, quantity for unit analysis, and full_date or fiscal attributes for time-based analysis. Use booking_type and is_renewal for renewal and new business analysis.
    datasets:
      - name: contracts
        description: Stores the commercial agreement attributes associated with a booking, including contract type, duration, renewal behavior, and coverage level.
        source: ontology.quotetobooking.dim_contract
        primary_key:
          - contract_key
        fields:
          - name: contract_key
            description: Unique surrogate identifier for a contract record used to link contracts to booking transactions.
          - name: contract_type
            description: Type of commercial agreement or service contract associated with the booking, such as Enterprise Agreement or SaaS Subscription.
          - name: term_months
            description: Number of months covered by the contract term.
          - name: auto_renew_flag
            description: Indicates whether the contract is set to renew automatically at the end of its term.
          - name: coverage_level
            description: Service or support coverage level provided under the contract.
      - name: customers
        description: Stores customer master data used to analyze bookings by account, segment, industry, and headquarters location.
        source: ontology.quotetobooking.dim_customer
        primary_key:
          - customer_key
        fields:
          - name: customer_key
            description: Unique surrogate identifier for a customer record used to join customers to booking transactions.
          - name: customer_id
            description: Business identifier assigned to the customer account.
          - name: customer_name
            description: Name of the customer account or organization making the purchase.
          - name: segment
            description: Market segment to which the customer belongs, such as Enterprise, Service Provider, or Public Sector.
          - name: industry
            description: Primary industry classification of the customer.
          - name: account_tier
            description: Strategic tier assigned to the customer account for sales prioritization and coverage.
          - name: hq_country
            description: Country where the customer’s headquarters is located.
          - name: hq_region
            description: Broad geographic region where the customer’s headquarters is located.
      - name: dates
        description: Stores calendar and fiscal date attributes used to analyze booking transactions over time.
        source: ontology.quotetobooking.dim_date
        primary_key:
          - date_key
        fields:
          - name: date_key
            description: Unique numeric identifier for the date record, typically formatted as YYYYMMDD.
          - name: full_date
            description: Actual calendar date represented by the date record.
            dimension:
              is_time: true
          - name: month_name
            description: Name of the calendar month for the date.
          - name: calendar_year
            description: Calendar year associated with the date.
          - name: fiscal_year
            description: Fiscal year used for business reporting and performance analysis.
          - name: fiscal_quarter
            description: Fiscal quarter used for financial and sales reporting.
          - name: fiscal_period_seq
            description: Sequential number representing the fiscal period order within the reporting timeline.
      - name: geographies
        description: Stores geographic reporting attributes used to analyze bookings by region, theater, and country.
        source: ontology.quotetobooking.dim_geography
        primary_key:
          - geography_key
        fields:
          - name: geography_key
            description: Unique surrogate identifier for a geography record used to join geography to booking transactions.
          - name: region
            description: High-level sales region used for reporting and performance analysis.
          - name: theater
            description: Intermediate sales geography grouping within a region.
          - name: country
            description: Country associated with the geography record.
      - name: partners
        description: Stores channel partner master data used to analyze indirect and direct sales routes, partner roles, and partner performance.
        source: ontology.quotetobooking.dim_partner
        primary_key:
          - partner_key
        fields:
          - name: partner_key
            description: Unique surrogate identifier for a partner record used to join partners to booking transactions.
          - name: partner_id
            description: Business identifier assigned to the partner account.
          - name: partner_name
            description: Name of the distributor, reseller, systems integrator, or direct partner involved in the sale.
          - name: partner_type
            description: Classification of the partner based on its business role, such as distributor or value-added reseller.
          - name: partner_tier
            description: Tier or accreditation level assigned to the partner.
          - name: route_to_market
            description: Sales channel path through which the product or service is sold, such as Direct, Reseller, or Two-Tier.
      - name: products
        description: Stores product master data used to analyze bookings across product families, technology domains, offer types, and business entities.
        source: ontology.quotetobooking.dim_product
        primary_key:
          - product_key
        fields:
          - name: product_key
            description: Unique surrogate identifier for a product record used to join products to booking transactions.
          - name: product_id
            description: Business identifier or SKU assigned to the product or service offering.
          - name: product_name
            description: Descriptive name of the product or service sold.
          - name: product_family
            description: Higher-level grouping of related products within the portfolio.
          - name: technology_domain
            description: Technology area or solution domain to which the product belongs.
          - name: offer_type
            description: Commercial offer model for the product, such as Hardware, SaaS Subscription, or Software Subscription.
          - name: business_entity
            description: Internal business portfolio or organizational entity responsible for the product.
      - name: sales_representatives
        description: Stores sales representative attributes used to analyze bookings by seller, sales role, team, and covered segment.
        source: ontology.quotetobooking.dim_sales_rep
        primary_key:
          - sales_rep_key
        fields:
          - name: sales_rep_key
            description: Unique surrogate identifier for a sales representative record used to join sellers to booking transactions.
          - name: rep_id
            description: Business identifier assigned to the sales representative.
          - name: rep_name
            description: Full name of the sales representative managing the customer or opportunity.
          - name: sales_role
            description: Role or title of the sales representative within the sales organization.
          - name: sales_team
            description: Sales team or organizational unit to which the representative belongs.
          - name: segment_covered
            description: Customer segment for which the sales representative is responsible.
      - name: bookings
        description: Stores individual completed sales booking transactions and related financial measures for revenue, contract, customer, partner, product, geography, and sales analysis.
        source: ontology.quotetobooking.fact_bookings
        primary_key:
          - booking_id
        fields:
          - name: booking_id
            description: Unique identifier for an individual booking transaction record.
          - name: order_number
            description: Sales order number associated with the booking transaction.
          - name: order_line_number
            description: Line number within the sales order identifying the specific booked item.
          - name: date_key
            description: Reference to the date dimension representing when the booking was recorded.
          - name: customer_key
            description: Reference to the customer associated with the booking transaction.
          - name: product_key
            description: Reference to the product or service booked in the transaction.
          - name: partner_key
            description: Reference to the partner involved in fulfilling or routing the sale.
          - name: geography_key
            description: Reference to the geography used for booking reporting and analysis.
          - name: sales_rep_key
            description: Reference to the sales representative responsible for the booking.
          - name: contract_key
            description: Reference to the contract or commercial agreement associated with the booking.
          - name: booking_type
            description: Classification of the booking event, such as New or Renewal.
          - name: is_renewal
            description: Indicates whether the booking represents a renewal transaction.
          - name: quantity
            description: Number of product units, licenses, or service quantities included in the booking.
          - name: unit_list_price_usd
            description: Standard list price per unit in U.S. dollars before discounts.
          - name: discount_pct
            description: Discount rate applied to the booked product or service.
          - name: booking_amount_usd
            description: Total booked revenue amount in U.S. dollars after applied pricing and discounts.
          - name: acv_usd
            description: Annualized contract value of the booking in U.S. dollars.
          - name: tcv_usd
            description: Total contract value of the booking over the full contract term in U.S. dollars.
    relationships:
      - name: bookings_to_contracts
        left_dataset: bookings
        right_dataset: contracts
        relationship_type: many_to_one
        join:
          left:
            - contract_key
          right:
            - contract_key
      - name: bookings_to_customers
        left_dataset: bookings
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_key
          right:
            - customer_key
      - name: bookings_to_dates
        left_dataset: bookings
        right_dataset: dates
        relationship_type: many_to_one
        join:
          left:
            - date_key
          right:
            - date_key
      - name: bookings_to_geographies
        left_dataset: bookings
        right_dataset: geographies
        relationship_type: many_to_one
        join:
          left:
            - geography_key
          right:
            - geography_key
      - name: bookings_to_partners
        left_dataset: bookings
        right_dataset: partners
        relationship_type: many_to_one
        join:
          left:
            - partner_key
          right:
            - partner_key
      - name: bookings_to_products
        left_dataset: bookings
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_key
          right:
            - product_key
      - name: bookings_to_sales_representatives
        left_dataset: bookings
        right_dataset: sales_representatives
        relationship_type: many_to_one
        join:
          left:
            - sales_rep_key
          right:
            - sales_rep_key
    metrics:
      - name: booking_count
        description: Count of booking transaction records.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: COUNT(bookings.booking_id)
      - name: distinct_order_count
        description: Count of distinct sales orders associated with bookings.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: COUNT(DISTINCT bookings.order_number)
      - name: total_quantity
        description: Total number of product units, licenses, or service quantities included in bookings.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(bookings.quantity)
      - name: total_booking_amount_usd
        description: Total booked revenue amount in U.S. dollars after applied pricing and discounts.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(bookings.booking_amount_usd)
      - name: total_acv_usd
        description: Total annualized contract value in U.S. dollars.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(bookings.acv_usd)
      - name: total_tcv_usd
        description: Total contract value in U.S. dollars over the full contract term.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(bookings.tcv_usd)
      - name: average_discount_pct
        description: Average discount rate applied to booked products or services.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: AVG(bookings.discount_pct)
      - name: average_selling_price_usd
        description: Average booked revenue per unit sold in U.S. dollars.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(bookings.booking_amount_usd) / NULLIF(SUM(bookings.quantity), 0)
      - name: renewal_booking_amount_usd
        description: Total booked revenue amount in U.S. dollars for renewal transactions.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(CASE WHEN bookings.is_renewal = 1 THEN bookings.booking_amount_usd ELSE 0 END)
      - name: net_new_booking_amount_usd
        description: Total booked revenue amount in U.S. dollars for non-renewal transactions.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(CASE WHEN bookings.is_renewal = 0 THEN bookings.booking_amount_usd ELSE 0 END)
      - name: average_booking_value_usd
        description: Average booked revenue amount per distinct booking transaction.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(bookings.booking_amount_usd) / NULLIF(COUNT(DISTINCT bookings.booking_id), 0)
