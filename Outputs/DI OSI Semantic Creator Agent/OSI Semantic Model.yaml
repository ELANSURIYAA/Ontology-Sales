version: "1.0"
semantic_models:
  - name: quote_to_booking_sales
    description: Semantic model for quote-to-booking sales analysis covering booking transactions and related customer, product, partner, geography, sales representative, contract, and date dimensions.
    ai_context:
      instructions: >
        Use this semantic model for quote-to-booking sales analysis at the booking transaction grain.
        fact_bookings represents booking records by booking identifier and order line.
        Use booking_date for time-based analysis and the provided revenue metrics for booking value analysis.
        Customer, product, partner, geography, sales representative, contract, and date datasets provide descriptive context for slicing and filtering.
    datasets:
      - name: bookings
        description: Stores transactional booking records for customer orders, including associated dimensions, quantities, pricing, discounts, and contract value metrics.
        source: quotetobooking.fact_bookings
        primary_key:
          - booking_id
        fields:
          - name: booking_id
            description: Unique identifier for the booking transaction record.
          - name: order_number
            description: Business order number associated with the booking transaction.
          - name: order_line_number
            description: Line number within the order identifying the specific booked item or service.
          - name: date_key
            description: Foreign key linking the booking to the date dimension.
          - name: customer_key
            description: Foreign key linking the booking to the customer dimension.
          - name: product_key
            description: Foreign key linking the booking to the product dimension.
          - name: partner_key
            description: Foreign key linking the booking to the partner dimension.
          - name: geography_key
            description: Foreign key linking the booking to the geography dimension.
          - name: sales_rep_key
            description: Foreign key linking the booking to the sales representative dimension.
          - name: contract_key
            description: Foreign key linking the booking to the contract dimension.
          - name: booking_type
            description: Indicates whether the booking is a new sale or a renewal.
            dimension:
              is_time: false
          - name: is_renewal
            description: Indicates whether the booking transaction is a renewal record, typically using 1 for yes and 0 for no.
            dimension:
              is_time: false
          - name: quantity
            description: Number of units, licenses, or items included in the booking line.
          - name: unit_list_price_usd
            description: Standard list price per unit in US dollars before discount.
          - name: discount_pct
            description: Discount rate applied to the booked item relative to list price.
          - name: booking_amount_usd
            description: Total booked revenue amount in US dollars after pricing and discount considerations.
          - name: acv_usd
            description: Annualized contract value of the booking in US dollars.
          - name: tcv_usd
            description: Total contract value of the booking in US dollars across the full contract term.
      - name: customers
        description: Stores customer master data used to analyze bookings by customer identity, segment, industry, tier, and headquarters location.
        source: quotetobooking.dim_customer
        primary_key:
          - customer_key
        fields:
          - name: customer_key
            description: Unique surrogate key for the customer record used to join customer details to booking transactions.
          - name: customer_id
            description: Business identifier assigned to the customer account.
            dimension:
              is_time: false
          - name: customer_name
            description: Name of the customer account or organization.
            dimension:
              is_time: false
          - name: segment
            description: Market segment to which the customer belongs, such as enterprise, service provider, or public sector.
            dimension:
              is_time: false
          - name: industry
            description: Industry classification of the customer account.
            dimension:
              is_time: false
          - name: account_tier
            description: Strategic classification of the customer account based on business importance or growth potential.
            dimension:
              is_time: false
          - name: hq_country
            description: Country where the customer’s headquarters is located.
            dimension:
              is_time: false
          - name: hq_region
            description: Geographic region where the customer’s headquarters is located.
            dimension:
              is_time: false
      - name: products
        description: Stores product master data used to analyze bookings by product, family, technology domain, offer type, and business entity.
        source: quotetobooking.dim_product
        primary_key:
          - product_key
        fields:
          - name: product_key
            description: Unique surrogate key for the product record used to join product details to booking transactions.
          - name: product_id
            description: Business identifier or SKU assigned to the product or offer.
            dimension:
              is_time: false
          - name: product_name
            description: Descriptive name of the product or solution being booked.
            dimension:
              is_time: false
          - name: product_family
            description: Higher-level grouping of related products within the portfolio.
            dimension:
              is_time: false
          - name: technology_domain
            description: Technology area or solution domain to which the product belongs.
            dimension:
              is_time: false
          - name: offer_type
            description: Commercial offer classification, such as hardware, SaaS subscription, or software subscription.
            dimension:
              is_time: false
          - name: business_entity
            description: Internal business unit or portfolio grouping responsible for the product.
            dimension:
              is_time: false
      - name: partners
        description: Stores channel partner attributes used to analyze bookings by partner identity, partner type, tier, and route to market.
        source: quotetobooking.dim_partner
        primary_key:
          - partner_key
        fields:
          - name: partner_key
            description: Unique surrogate key for the partner record used to join partner details to booking transactions.
          - name: partner_id
            description: Business identifier assigned to the partner account.
            dimension:
              is_time: false
          - name: partner_name
            description: Name of the partner organization involved in the sale.
            dimension:
              is_time: false
          - name: partner_type
            description: Classification of the partner, such as distributor, reseller, direct, or systems integrator.
            dimension:
              is_time: false
          - name: partner_tier
            description: Program tier or status level assigned to the partner.
            dimension:
              is_time: false
          - name: route_to_market
            description: Sales channel path through which the booking is transacted, such as direct, reseller, or two-tier.
            dimension:
              is_time: false
      - name: geographies
        description: Stores geographic classifications used to analyze bookings by region, theater, and country.
        source: quotetobooking.dim_geography
        primary_key:
          - geography_key
        fields:
          - name: geography_key
            description: Unique surrogate key for the geography record used to join geographic attributes to booking transactions.
          - name: region
            description: High-level geographic reporting region for the booking or customer coverage area.
            dimension:
              is_time: false
          - name: theater
            description: Sub-regional sales theater or operating area within a broader region.
            dimension:
              is_time: false
          - name: country
            description: Country associated with the geography record.
            dimension:
              is_time: false
      - name: sales_representatives
        description: Stores sales representative attributes used to analyze bookings by seller identity, role, team, and covered segment.
        source: quotetobooking.dim_sales_rep
        primary_key:
          - sales_rep_key
        fields:
          - name: sales_rep_key
            description: Unique surrogate key for the sales representative record used to join seller details to booking transactions.
          - name: rep_id
            description: Business identifier assigned to the sales representative.
            dimension:
              is_time: false
          - name: rep_name
            description: Full name of the sales representative associated with the booking.
            dimension:
              is_time: false
          - name: sales_role
            description: Job role or selling responsibility of the sales representative.
            dimension:
              is_time: false
          - name: sales_team
            description: Sales team or organizational unit to which the sales representative belongs.
            dimension:
              is_time: false
          - name: segment_covered
            description: Customer segment or market segment covered by the sales representative.
            dimension:
              is_time: false
      - name: contracts
        description: Stores descriptive contract attributes used to classify bookings by contract structure, duration, renewal behavior, and coverage level.
        source: quotetobooking.dim_contract
        primary_key:
          - contract_key
        fields:
          - name: contract_key
            description: Unique surrogate key for the contract record used to join contract details to booking transactions.
          - name: contract_type
            description: Type of customer contract or service agreement associated with the booking.
            dimension:
              is_time: false
          - name: term_months
            description: Number of months covered by the contract term.
            dimension:
              is_time: false
          - name: auto_renew_flag
            description: Indicates whether the contract is set to renew automatically at the end of its term.
            dimension:
              is_time: false
          - name: coverage_level
            description: Service or support coverage level provided under the contract.
            dimension:
              is_time: false
      - name: booking_dates
        description: Stores calendar and fiscal date attributes used to analyze bookings over time by date, month, quarter, and year.
        source: quotetobooking.dim_date
        primary_key:
          - date_key
        fields:
          - name: date_key
            description: Numeric formatted date key used to join time attributes to booking transactions.
          - name: full_date
            description: Actual calendar date represented by the date record.
            dimension:
              is_time: true
          - name: month_name
            description: Name of the calendar month for the date.
            dimension:
              is_time: true
          - name: calendar_year
            description: Calendar year corresponding to the date.
            dimension:
              is_time: true
          - name: fiscal_year
            description: Fiscal year corresponding to the date based on business reporting conventions.
            dimension:
              is_time: true
          - name: fiscal_quarter
            description: Fiscal quarter corresponding to the date.
            dimension:
              is_time: true
          - name: fiscal_period_seq
            description: Sequential number representing the fiscal reporting period in order.
            dimension:
              is_time: true
    relationships:
      - name: bookings_to_contracts
        left_dataset: bookings
        right_dataset: contracts
        relationship_type: many_to_one
        join:
          left:
            - contract_key
          right:
            - contract_key
      - name: bookings_to_customers
        left_dataset: bookings
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_key
          right:
            - customer_key
      - name: bookings_to_booking_dates
        left_dataset: bookings
        right_dataset: booking_dates
        relationship_type: many_to_one
        join:
          left:
            - date_key
          right:
            - date_key
      - name: bookings_to_geographies
        left_dataset: bookings
        right_dataset: geographies
        relationship_type: many_to_one
        join:
          left:
            - geography_key
          right:
            - geography_key
      - name: bookings_to_partners
        left_dataset: bookings
        right_dataset: partners
        relationship_type: many_to_one
        join:
          left:
            - partner_key
          right:
            - partner_key
      - name: bookings_to_products
        left_dataset: bookings
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_key
          right:
            - product_key
      - name: bookings_to_sales_representatives
        left_dataset: bookings
        right_dataset: sales_representatives
        relationship_type: many_to_one
        join:
          left:
            - sales_rep_key
          right:
            - sales_rep_key
    metrics:
      - name: booking_count
        description: Count of booking transaction records.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: COUNT(bookings.booking_id)
      - name: distinct_order_count
        description: Count of distinct customer orders represented in booking transactions.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: COUNT(DISTINCT bookings.order_number)
      - name: total_quantity
        description: Total number of units, licenses, or items included in booking lines.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(bookings.quantity)
      - name: total_booking_amount_usd
        description: Total booked revenue amount in US dollars.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(bookings.booking_amount_usd)
      - name: total_acv_usd
        description: Total annual contract value in US dollars.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(bookings.acv_usd)
      - name: total_tcv_usd
        description: Total contract value in US dollars.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(bookings.tcv_usd)
      - name: average_discount_pct
        description: Average discount rate applied to booked items.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: AVG(bookings.discount_pct)
      - name: average_selling_price_usd
        description: Average booked revenue amount per unit.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(bookings.booking_amount_usd) / NULLIF(SUM(bookings.quantity), 0)
      - name: renewal_booking_amount_usd
        description: Total booked revenue amount for renewal bookings in US dollars.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(CASE WHEN bookings.is_renewal = 1 THEN bookings.booking_amount_usd ELSE 0 END)
      - name: net_new_booking_amount_usd
        description: Total booked revenue amount for non-renewal bookings in US dollars.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(CASE WHEN bookings.is_renewal = 0 THEN bookings.booking_amount_usd ELSE 0 END)
      - name: average_booking_value_usd
        description: Average booking revenue amount per booking transaction.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(bookings.booking_amount_usd) / NULLIF(COUNT(DISTINCT bookings.booking_id), 0)
