version: "1.0"

semantic_model:
  - name: customer_experience_semantic_model
    description: >-
      Comprehensive semantic model for Customer Experience analytics covering customer relationships,
      sales transactions, product inventory, shipment logistics, marketing campaigns, employee management,
      and exchange rate data. This model supports end-to-end analytical queries across customer lifecycle,
      order fulfillment, product performance, supplier reliability, and campaign effectiveness.
    
    ai_context:
      instructions: >-
        ## Dataset Grain Guide
        
        - CUSTOMERS: One row per customer (grain: customer_id)
        - CAMPAIGNS: One row per marketing campaign (grain: campaign_id)
        - CUSTOMER_ACCOUNT_MANAGERS: One row per customer-employee assignment with validity period (grain: assignment_id). This is an SCD Type-2 table tracking historical account manager assignments.
        - EMPLOYEES: One row per employee (grain: employee_id). Contains self-referencing hierarchy via manager_id.
        - EXCHANGE_RATES: One row per currency per date (grain: currency_code + rate_date). Use for as-of currency conversion.
        - ORDER_ITEMS: One row per order line item (grain: order_item_id). Multiple items per order.
        - ORDERS: One row per customer order (grain: order_id)
        - PRODUCT_CATEGORIES: One row per product category (grain: category_id). Contains hierarchical structure via parent_category_id.
        - PRODUCTS: One row per product (grain: product_id)
        - SHIPMENT_ITEMS: One row per shipment line item (grain: shipment_item_id). Multiple items per shipment.
        - SHIPMENTS: One row per supplier-to-store shipment (grain: shipment_id)
        - STORES: One row per store location (grain: store_id)
        - SUPPLIERS: One row per supplier (grain: supplier_id)
        
        ## Measure Selection Guide
        
        ### Order-Level Revenue
        Use ORDERS.total_amount_usd for order-level revenue analysis. This represents the complete order value.
        Do NOT sum ORDERS.total_amount_usd after joining to ORDER_ITEMS as this will duplicate revenue.
        
        ### Order-Item-Level Revenue
        Use ORDER_ITEMS.line_revenue_usd for product-level or order-item-level revenue analysis.
        This is the correct measure when analyzing revenue by product, category, or order line.
        
        ### Order-Level Cost
        Use ORDERS.total_cost_usd for order-level cost analysis.
        Do NOT sum ORDERS.total_cost_usd after joining to ORDER_ITEMS as this will duplicate cost.
        
        ### Order-Item-Level Cost
        Use ORDER_ITEMS.line_cost_usd for product-level or order-item-level cost analysis.
        
        ### Shipment Cost
        Use SHIPMENTS.freight_cost_usd for shipment-level freight cost analysis.
        
        ## Join Guidance
        
        ### Standard Relationships
        - ORDERS → CUSTOMERS via customer_id (many-to-one)
        - ORDERS → STORES via store_id (many-to-one)
        - ORDER_ITEMS → ORDERS via order_id (many-to-one)
        - ORDER_ITEMS → PRODUCTS via product_id (many-to-one)
        - PRODUCTS → PRODUCT_CATEGORIES via category_id (many-to-one)
        - PRODUCTS → SUPPLIERS via supplier_id (many-to-one)
        - SHIPMENTS → SUPPLIERS via supplier_id (many-to-one)
        - SHIPMENTS → STORES via store_id (many-to-one)
        - SHIPMENT_ITEMS → SHIPMENTS via shipment_id (many-to-one)
        - SHIPMENT_ITEMS → PRODUCTS via product_id (many-to-one)
        
        ### SCD Type-2 Relationship: Customer Account Managers
        To find the account manager for a customer at a specific point in time (e.g., order_date):
        
        JOIN CUSTOMER_ACCOUNT_MANAGERS cam ON
            cam.customer_id = orders.customer_id
            AND TRUNC(orders.order_date) >= cam.valid_from
            AND (cam.valid_to IS NULL OR TRUNC(orders.order_date) < cam.valid_to)
        
        Then join to EMPLOYEES via cam.employee_id to get account manager details.
        
        The valid_to = NULL represents the current assignment.
        Use TRUNC() for Oracle date comparison to handle timestamp-to-date conversion.
        
        ### As-Of Relationship: Exchange Rates
        To convert order amounts using the exchange rate effective on the order date:
        
        SELECT er.usd_rate
        FROM EXCHANGE_RATES er
        WHERE er.currency_code = orders.currency_code
          AND er.rate_date <= TRUNC(orders.order_date)
        ORDER BY er.rate_date DESC
        FETCH FIRST 1 ROW ONLY
        
        This retrieves the most recent exchange rate on or before the order date.
        
        ### Recursive Relationship: Employee Hierarchy
        EMPLOYEES.manager_id references EMPLOYEES.employee_id, creating a management hierarchy.
        
        To traverse the hierarchy, use Oracle recursive query syntax:
        
        WITH RECURSIVE employee_hierarchy AS (
          SELECT employee_id, employee_name, manager_id, 1 as level
          FROM EMPLOYEES
          WHERE manager_id IS NULL
          UNION ALL
          SELECT e.employee_id, e.employee_name, e.manager_id, eh.level + 1
          FROM EMPLOYEES e
          JOIN employee_hierarchy eh ON e.manager_id = eh.employee_id
        )
        SELECT * FROM employee_hierarchy
        
        ### Hierarchical Relationship: Product Categories
        PRODUCT_CATEGORIES.parent_category_id references PRODUCT_CATEGORIES.category_id, creating a category hierarchy.
        
        To traverse the category hierarchy, use Oracle recursive query syntax similar to employee hierarchy.
        
        ## Double-Counting Prevention
        
        ### Critical: Order-Level vs Order-Item-Level Measures
        
        When joining ORDERS to ORDER_ITEMS:
        - Each order may have multiple order items
        - Summing ORDERS.total_amount_usd after the join will count each order's total multiple times (once per item)
        - Summing ORDERS.total_cost_usd after the join will count each order's cost multiple times
        
        Solutions:
        1. For order-level analysis: Query ORDERS directly without joining to ORDER_ITEMS
        2. For product-level analysis: Use ORDER_ITEMS.line_revenue_usd and ORDER_ITEMS.line_cost_usd
        3. For mixed analysis: Use window functions or subqueries to avoid duplication
        
        Example (INCORRECT - duplicates order totals):
        SELECT SUM(o.total_amount_usd) FROM ORDERS o JOIN ORDER_ITEMS oi ON o.order_id = oi.order_id
        
        Example (CORRECT - order-level revenue):
        SELECT SUM(o.total_amount_usd) FROM ORDERS o
        
        Example (CORRECT - product-level revenue):
        SELECT SUM(oi.line_revenue_usd) FROM ORDER_ITEMS oi
        
        ### Shipment-Level vs Shipment-Item-Level Measures
        
        Similar grain difference exists between SHIPMENTS and SHIPMENT_ITEMS.
        - Use SHIPMENTS.freight_cost_usd for shipment-level freight analysis
        - Do NOT sum SHIPMENTS.freight_cost_usd after joining to SHIPMENT_ITEMS
        
        ## Time Analysis
        
        ### Order Analysis
        Use ORDERS.order_date for order placement timing analysis.
        This is a TIMESTAMP field - use TRUNC() to extract date portion for daily aggregation.
        
        ### Shipment Analysis
        Use SHIPMENTS.ship_date for shipment departure timing.
        Use SHIPMENTS.expected_arrival and SHIPMENTS.actual_arrival for delivery performance analysis.
        
        ### Customer Lifecycle
        Use CUSTOMERS.signup_date for customer acquisition analysis.
        Use CUSTOMERS.created_at for record creation timing.
        
        ### Campaign Timing
        Use CAMPAIGNS.start_date and CAMPAIGNS.end_date for campaign period analysis.
        
        ## Query Restrictions and Ambiguities
        
        ### Currency Conversion
        ORDERS contains both total_amount_usd (standardized USD) and local_amount (original currency).
        For consistent cross-currency analysis, always use total_amount_usd.
        For currency-specific analysis, use local_amount with currency_code.
        
        ### Returned Orders
        ORDERS.is_returned indicates whether an order was returned.
        For net revenue analysis, filter WHERE is_returned = false or adjust revenue calculations.
        
        ### Order Status
        ORDERS.order_status tracks order lifecycle (e.g., 'Placed', 'Shipped', 'Delivered', 'Cancelled').
        Consider filtering by status for specific analytical scenarios.
        
        ### Shipment Status
        SHIPMENTS.shipment_status tracks shipment lifecycle (e.g., 'In Transit', 'Delivered', 'Delayed').
        
        ### Delivery Performance
        Calculate delivery delay as: actual_arrival - expected_arrival
        NULL actual_arrival indicates shipment not yet delivered.
        
        ### Customer Segmentation
        CUSTOMERS.customer_segment classifies customers (e.g., 'Regular', 'Premium', 'VIP').
        CAMPAIGNS.target_segment indicates intended campaign audience.
        
        ### Employee Region
        EMPLOYEES.region represents geographic territory assignment.
        This may differ from customer location or store location.
    
    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Customer master data containing comprehensive customer profiles, contact information,
          and segmentation. One row per customer. Primary key: customer_id.
        source: CUSTOMERS
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: Unique identifier for a customer.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          - name: first_name
            business_name: First Name
            description: Given name of the customer.
            sql_type: VARCHAR(50)
            constraints:
              - NOT NULL
          - name: last_name
            business_name: Last Name
            description: Family name of the customer.
            sql_type: VARCHAR(50)
            constraints:
              - NOT NULL
          - name: email
            business_name: Email
            description: Email address used to contact the customer.
            sql_type: VARCHAR(150)
            constraints:
              - NOT NULL
              - UNIQUE
          - name: phone
            business_name: Phone
            description: Primary phone number of the customer.
            sql_type: VARCHAR(20)
            constraints: []
          - name: city
            business_name: City
            description: City where the customer is located.
            sql_type: VARCHAR(80)
            constraints: []
            dimension:
              is_time: false
          - name: country
            business_name: Country
            description: Country where the customer is located.
            sql_type: VARCHAR(80)
            constraints: []
            dimension:
              is_time: false
          - name: customer_segment
            business_name: Customer Segment
            description: Segment classification assigned to the customer.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          - name: signup_date
            business_name: Signup Date
            description: Date when the customer registered or signed up.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          - name: created_at
            business_name: Created At
            description: Timestamp when the customer record was created.
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
      
      - name: campaigns
        business_name: Campaigns
        description: >-
          Marketing campaign master data containing campaign definitions, channels, target segments,
          timing, and discount offers. One row per marketing campaign. Primary key: campaign_id.
        source: CAMPAIGNS
        primary_key:
          - campaign_id
        fields:
          - name: campaign_id
            business_name: Campaign Identifier
            description: Unique identifier for a marketing campaign.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          - name: campaign_name
            business_name: Campaign Name
            description: Name of the marketing campaign.
            sql_type: VARCHAR(120)
            constraints:
              - NOT NULL
          - name: channel
            business_name: Channel
            description: Marketing channel used to run the campaign.
            sql_type: VARCHAR(20)
            constraints: []
            dimension:
              is_time: false
          - name: target_segment
            business_name: Target Segment
            description: Customer segment targeted by the campaign.
            sql_type: VARCHAR(20)
            constraints: []
            dimension:
              is_time: false
          - name: start_date
            business_name: Start Date
            description: Date when the campaign starts.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          - name: end_date
            business_name: End Date
            description: Date when the campaign ends.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          - name: discount_pct
            business_name: Discount Pct
            description: Percentage discount offered by the campaign.
            sql_type: NUMERIC(5,2)
            constraints:
              - NOT NULL
      
      - name: customer_account_managers
        business_name: Customer Account Managers
        description: >-
          SCD Type-2 table tracking historical customer-to-account-manager assignments with validity periods.
          One row per assignment with effective date range. Primary key: assignment_id.
          This table maintains history of which employee managed which customer during which time period.
        source: CUSTOMER_ACCOUNT_MANAGERS
        primary_key:
          - assignment_id
        fields:
          - name: assignment_id
            business_name: Assignment Identifier
            description: Unique identifier for a customer account manager assignment.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          - name: customer_id
            business_name: Customer Reference
            description: References the related customer record.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          - name: employee_id
            business_name: Employee Reference
            description: References the employee assigned as the account manager.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          - name: valid_from
            business_name: Valid From
            description: Date when the account manager assignment becomes effective.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          - name: valid_to
            business_name: Valid To
            description: Date when the account manager assignment ends. NULL indicates current assignment.
            sql_type: DATE
            constraints: []
            dimension:
              is_time: true
      
      - name: employees
        business_name: Employees
        description: >-
          Employee master data containing personnel records, roles, regional assignments, and management hierarchy.
          One row per employee. Primary key: employee_id. Contains self-referencing hierarchy via manager_id.
        source: EMPLOYEES
        primary_key:
          - employee_id
        fields:
          - name: employee_id
            business_name: Employee Identifier
            description: Unique identifier for an employee.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          - name: employee_name
            business_name: Employee Name
            description: Full name of the employee.
            sql_type: VARCHAR(100)
            constraints:
              - NOT NULL
          - name: role
            business_name: Role
            description: Job role or position of the employee.
            sql_type: VARCHAR(40)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          - name: manager_id
            business_name: Manager Reference
            description: References the employee who manages this employee. Self-referencing foreign key for hierarchy.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
          - name: region
            business_name: Region
            description: Geographic region assigned to the employee.
            sql_type: VARCHAR(80)
            constraints: []
            dimension:
              is_time: false
          - name: hire_date
            business_name: Hire Date
            description: Date when the employee was hired.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
      
      - name: exchange_rates
        business_name: Exchange Rates
        description: >-
          Daily exchange rate data for currency conversion. One row per currency per date.
          Primary key: currency_code + rate_date. Use for as-of currency conversion based on transaction date.
        source: EXCHANGE_RATES
        primary_key:
          - currency_code
          - rate_date
        fields:
          - name: currency_code
            business_name: Currency Code
            description: ISO currency code for the exchange rate.
            sql_type: VARCHAR(3)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          - name: rate_date
            business_name: Rate Date
            description: Date for which the exchange rate applies.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          - name: usd_rate
            business_name: Usd Rate
            description: Exchange rate of the currency against USD.
            sql_type: NUMERIC(12,6)
            constraints:
              - NOT NULL
      
      - name: order_items
        business_name: Order Items
        description: >-
          Order line item details containing product, quantity, pricing, and calculated revenue/cost per line.
          One row per order line item. Primary key: order_item_id. Multiple items per order.
          Contains computed fields: line_revenue_usd and line_cost_usd.
        source: ORDER_ITEMS
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: Unique identifier for an order line item.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          - name: order_id
            business_name: Order Reference
            description: References the related order record.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          - name: product_id
            business_name: Product Reference
            description: References the product included in the order item.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          - name: quantity
            business_name: Quantity
            description: Number of units of the product ordered.
            sql_type: INT4
            constraints:
              - NOT NULL
          - name: unit_price_usd
            business_name: Unit Price Usd
            description: Selling price per unit in USD.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          - name: unit_cost_usd
            business_name: Unit Cost Usd
            description: Cost per unit in USD.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          - name: discount_pct
            business_name: Discount Pct
            description: Percentage discount applied to the order item.
            sql_type: NUMERIC(5,2)
            constraints:
              - NOT NULL
          - name: line_revenue_usd
            business_name: Line Revenue Usd
            description: Calculated revenue for the order item line in USD after discounts.
            sql_type: NUMERIC(12,2)
            constraints:
              - COMPUTED
          - name: line_cost_usd
            business_name: Line Cost Usd
            description: Calculated cost for the order item line in USD.
            sql_type: NUMERIC(12,2)
            constraints:
              - COMPUTED
      
      - name: orders
        business_name: Orders
        description: >-
          Customer order header data containing order-level information including customer, store, timing,
          channel, payment, status, rating, currency, and totals. One row per customer order. Primary key: order_id.
        source: ORDERS
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: Unique identifier for a customer order.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          - name: customer_id
            business_name: Customer Reference
            description: References the customer who placed the order.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          - name: store_id
            business_name: Store Reference
            description: References the store fulfilling the order.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          - name: order_date
            business_name: Order Date
            description: Timestamp when the order was placed.
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          - name: order_channel
            business_name: Order Channel
            description: Channel through which the order was placed.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          - name: payment_method
            business_name: Payment Method
            description: Method used by the customer to pay for the order.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          - name: order_status
            business_name: Order Status
            description: Current status of the order.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          - name: is_returned
            business_name: Is Returned
            description: Indicates whether the order has been returned.
            sql_type: BOOL
            constraints:
              - NOT NULL
          - name: customer_rating
            business_name: Customer Rating
            description: Rating provided by the customer for the order experience.
            sql_type: INT2
            constraints: []
          - name: currency_code
            business_name: Currency Code
            description: Currency code used for the order amounts.
            sql_type: VARCHAR(3)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          - name: total_amount_usd
            business_name: Total Amount Usd
            description: Total order amount in USD.
            sql_type: NUMERIC(12,2)
            constraints:
              - NOT NULL
          - name: local_amount
            business_name: Local Amount
            description: Total order amount in the local currency.
            sql_type: NUMERIC(14,2)
            constraints:
              - NOT NULL
          - name: total_cost_usd
            business_name: Total Cost Usd
            description: Total cost of fulfilling the order in USD.
            sql_type: NUMERIC(12,2)
            constraints:
              - NOT NULL
      
      - name: product_categories
        business_name: Product Categories
        description: >-
          Product category master data with hierarchical structure. One row per product category.
          Primary key: category_id. Contains self-referencing hierarchy via parent_category_id.
        source: PRODUCT_CATEGORIES
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: Unique identifier for a product category.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          - name: category_name
            business_name: Category Name
            description: Name of the product category.
            sql_type: VARCHAR(100)
            constraints:
              - NOT NULL
          - name: parent_category_id
            business_name: Parent Category Reference
            description: References the parent category in the hierarchy. Self-referencing foreign key.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
      
      - name: products
        business_name: Products
        description: >-
          Product master data containing product definitions, category assignments, supplier relationships,
          and standard pricing. One row per product. Primary key: product_id.
        source: PRODUCTS
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: Unique identifier for a product.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          - name: product_name
            business_name: Product Name
            description: Name or title of the product.
            sql_type: VARCHAR(150)
            constraints:
              - NOT NULL
          - name: category_id
            business_name: Category Reference
            description: References the category to which the product belongs.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          - name: unit_cost_usd
            business_name: Unit Cost Usd
            description: Cost to acquire or produce one unit of the product in USD.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          - name: unit_price_usd
            business_name: Unit Price Usd
            description: Selling price per unit of the product in USD.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          - name: supplier_id
            business_name: Supplier Reference
            description: References the supplier providing the product.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          - name: created_at
            business_name: Created At
            description: Timestamp when the product record was created.
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
      
      - name: shipment_items
        business_name: Shipment Items
        description: >-
          Shipment line item details containing product and quantity per shipment.
          One row per shipment line item. Primary key: shipment_item_id. Multiple items per shipment.
        source: SHIPMENT_ITEMS
        primary_key:
          - shipment_item_id
        fields:
          - name: shipment_item_id
            business_name: Shipment Item Identifier
            description: Unique identifier for a shipment line item.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          - name: shipment_id
            business_name: Shipment Reference
            description: References the shipment containing the item.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          - name: product_id
            business_name: Product Reference
            description: References the product included in the shipment item.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          - name: quantity
            business_name: Quantity
            description: Number of units of the product in the shipment item.
            sql_type: INT4
            constraints:
              - NOT NULL
      
      - name: shipments
        business_name: Shipments
        description: >-
          Shipment header data tracking supplier-to-store shipments including timing, delivery performance,
          freight cost, and status. One row per shipment. Primary key: shipment_id.
        source: SHIPMENTS
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: Unique identifier for a shipment.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          - name: supplier_id
            business_name: Supplier Reference
            description: References the supplier responsible for the shipment.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          - name: store_id
            business_name: Store Reference
            description: References the destination store for the shipment.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          - name: ship_date
            business_name: Ship Date
            description: Timestamp when the shipment departed.
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          - name: expected_arrival
            business_name: Expected Arrival
            description: Expected arrival date of the shipment.
            sql_type: DATE
            constraints: []
            dimension:
              is_time: true
