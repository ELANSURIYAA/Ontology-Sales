    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order is placed by exactly one customer.
          A customer may place zero or more orders. Join on customer_id equality.
      
      - name: orders_to_stores
        left_dataset: orders
        right_dataset: stores
        relationship_type: many_to_one
        join:
          left:
            - store_id
          right:
            - store_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order is fulfilled by exactly one store.
          A store may fulfill zero or more orders. Join on store_id equality.
      
      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order item belongs to exactly one order.
          An order may contain one or more order items. Join on order_id equality.
          CRITICAL: Do not sum order-level measures (total_amount_usd, total_cost_usd) after this join
          as it will duplicate order totals across multiple items.
      
      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order item references exactly one product.
          A product may appear in zero or more order items. Join on product_id equality.
      
      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each product belongs to exactly one category.
          A category may contain zero or more products. Join on category_id equality.
      
      - name: products_to_suppliers
        left_dataset: products
        right_dataset: suppliers
        relationship_type: many_to_one
        join:
          left:
            - supplier_id
          right:
            - supplier_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each product is provided by exactly one supplier.
          A supplier may provide zero or more products. Join on supplier_id equality.
      
      - name: shipments_to_suppliers
        left_dataset: shipments
        right_dataset: suppliers
        relationship_type: many_to_one
        join:
          left:
            - supplier_id
          right:
            - supplier_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each shipment originates from exactly one supplier.
          A supplier may send zero or more shipments. Join on supplier_id equality.
      
      - name: shipments_to_stores
        left_dataset: shipments
        right_dataset: stores
        relationship_type: many_to_one
        join:
          left:
            - store_id
          right:
            - store_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each shipment is destined for exactly one store.
          A store may receive zero or more shipments. Join on store_id equality.
      
      - name: shipment_items_to_shipments
        left_dataset: shipment_items
        right_dataset: shipments
        relationship_type: many_to_one
        join:
          left:
            - shipment_id
          right:
            - shipment_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each shipment item belongs to exactly one shipment.
          A shipment may contain one or more shipment items. Join on shipment_id equality.
          CRITICAL: Do not sum shipment-level measures (freight_cost_usd) after this join
          as it will duplicate shipment costs across multiple items.
      
      - name: shipment_items_to_products
        left_dataset: shipment_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each shipment item references exactly one product.
          A product may appear in zero or more shipment items. Join on product_id equality.
      
      - name: customer_account_managers_to_customers
        left_dataset: customer_account_managers
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each assignment record references exactly one customer.
          A customer may have multiple assignment records over time (SCD Type-2).
          Join on customer_id equality.
      
      - name: customer_account_managers_to_employees
        left_dataset: customer_account_managers
        right_dataset: employees
        relationship_type: many_to_one
        join:
          left:
            - employee_id
          right:
            - employee_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each assignment record references exactly one employee.
          An employee may have multiple assignment records (managing multiple customers over time).
          Join on employee_id equality.
      
      - name: orders_to_customer_account_managers_scd
        left_dataset: orders
        right_dataset: customer_account_managers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
            - order_date
          right:
            - customer_id
            - valid_from
            - valid_to
        join_type: scd_type2_date_range
        resolution: >-
          SCD Type-2 temporal relationship. To find the account manager responsible for a customer
          at the time an order was placed, join on customer_id and check that the order_date falls
          within the validity period [valid_from, valid_to).
          
          Oracle SQL implementation:
          JOIN customer_account_managers cam ON
              cam.customer_id = orders.customer_id
              AND TRUNC(orders.order_date) >= cam.valid_from
              AND (cam.valid_to IS NULL OR TRUNC(orders.order_date) < cam.valid_to)
          
          NULL valid_to represents the current assignment (open-ended validity).
          Use TRUNC() to convert timestamp to date for comparison.
          The relationship is many-to-one: each order has at most one account manager at order time.
      
      - name: orders_to_exchange_rates_asof
        left_dataset: orders
        right_dataset: exchange_rates
        relationship_type: many_to_one
        join:
          left:
            - currency_code
            - order_date
          right:
            - currency_code
            - rate_date
        join_type: asof
        resolution: >-
          As-of temporal relationship. To convert order amounts using the exchange rate effective
          on the order date, find the most recent exchange rate on or before the order date for
          the order's currency.
          
          Oracle SQL implementation:
          SELECT er.usd_rate
          FROM exchange_rates er
          WHERE er.currency_code = orders.currency_code
            AND er.rate_date <= TRUNC(orders.order_date)
          ORDER BY er.rate_date DESC
          FETCH FIRST 1 ROW ONLY
          
          This retrieves the exchange rate that was in effect when the order was placed.
          The relationship is many-to-one: each order uses exactly one exchange rate.
      
      - name: employees_hierarchy
        left_dataset: employees
        right_dataset: employees
        relationship_type: many_to_one
        join:
          left:
            - manager_id
          right:
            - employee_id
        join_type: recursive
        resolution: >-
          Recursive self-referencing relationship. Each employee may report to exactly one manager
          (another employee). An employee with NULL manager_id is a top-level executive.
          A manager may have zero or more direct reports.
          
          To traverse the full management hierarchy, use Oracle recursive query syntax:
          
          WITH employee_hierarchy(employee_id, employee_name, manager_id, hierarchy_level) AS (
            SELECT employee_id, employee_name, manager_id, 1
            FROM employees
            WHERE manager_id IS NULL
            UNION ALL
            SELECT e.employee_id, e.employee_name, e.manager_id, eh.hierarchy_level + 1
            FROM employees e
            JOIN employee_hierarchy eh ON e.manager_id = eh.employee_id
          )
          SELECT * FROM employee_hierarchy
          
          This builds the complete organizational hierarchy from top executives down to individual contributors.
      
      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: recursive
        resolution: >-
          Recursive self-referencing relationship. Each category may belong to exactly one parent category.
          A category with NULL parent_category_id is a top-level category.
          A parent category may have zero or more child categories.
          
          To traverse the full category hierarchy, use Oracle recursive query syntax:
          
          WITH category_hierarchy(category_id, category_name, parent_category_id, hierarchy_level) AS (
            SELECT category_id, category_name, parent_category_id, 1
            FROM product_categories
            WHERE parent_category_id IS NULL
            UNION ALL
            SELECT pc.category_id, pc.category_name, pc.parent_category_id, ch.hierarchy_level + 1
            FROM product_categories pc
            JOIN category_hierarchy ch ON pc.parent_category_id = ch.category_id
          )
          SELECT * FROM category_hierarchy
          
          This builds the complete category hierarchy from top-level categories down to leaf categories.
    
    metrics:
      - name: total_revenue
        business_name: Total Revenue
        description: >-
          Total order revenue in USD across all orders. Aggregates order-level total_amount_usd.
          Use for order-level revenue analysis. Result is a single aggregated value.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) AS total_revenue
                FROM orders
              columns_used:
                - orders.total_amount_usd
      
      - name: total_cost
        business_name: Total Cost
        description: >-
          Total order cost in USD across all orders. Aggregates order-level total_cost_usd.
          Use for order-level cost analysis. Result is a single aggregated value.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    SUM(orders.total_cost_usd) AS total_cost
                FROM orders
              columns_used:
                - orders.total_cost_usd
      
      - name: gross_profit
        business_name: Gross Profit
        description: >-
          Total gross profit in USD calculated as total revenue minus total cost at order level.
          Result is a single aggregated value.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) - SUM(orders.total_cost_usd) AS gross_profit
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.total_cost_usd
      
      - name: gross_margin_pct
        business_name: Gross Margin Percentage
        description: >-
          Gross margin percentage calculated as (total revenue - total cost) / total revenue * 100.
          Handles division by zero. Result is a single percentage value.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    CASE
                        WHEN SUM(orders.total_amount_usd) = 0 THEN 0
                        ELSE
                            (SUM(orders.total_amount_usd) - SUM(orders.total_cost_usd))
                            / NULLIF(SUM(orders.total_amount_usd), 0) * 100
                    END AS gross_margin_pct
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.total_cost_usd
      
      - name: order_count
        business_name: Order Count
        description: >-
          Total number of orders. Counts distinct order_id values.
          Result is a single count value.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    COUNT(orders.order_id) AS order_count
                FROM orders
              columns_used:
                - orders.order_id
      
      - name: customer_count
        business_name: Customer Count
        description: >-
          Total number of unique customers. Counts distinct customer_id values.
          Result is a single count value.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    COUNT(DISTINCT customers.customer_id) AS customer_count
                FROM customers
              columns_used:
                - customers.customer_id
      
      - name: product_count
        business_name: Product Count
        description: >-
          Total number of products. Counts distinct product_id values.
          Result is a single count value.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    COUNT(products.product_id) AS product_count
                FROM products
              columns_used:
                - products.product_id
      
      - name: units_sold
        business_name: Units Sold
        description: >-
          Total number of product units sold across all order items.
          Sums quantity from order_items. Result is a single aggregated value.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    SUM(order_items.quantity) AS units_sold
                FROM order_items
              columns_used:
                - order_items.quantity
      
      - name: average_order_value
        business_name: Average Order Value
        description: >-
          Average order value in USD calculated as total revenue divided by number of orders.
          Handles division by zero. Result is a single average value.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) / NULLIF(COUNT(orders.order_id), 0) AS average_order_value
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.order_id
      
      - name: revenue_per_customer
        business_name: Revenue Per Customer
        description: >-
          Average revenue per customer calculated as total revenue divided by number of unique customers who placed orders.
          Handles division by zero. Result is a single average value.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) / NULLIF(COUNT(DISTINCT orders.customer_id), 0) AS revenue_per_customer
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.customer_id
      
      - name: orders_per_customer
        business_name: Orders Per Customer
        description: >-
          Average number of orders per customer calculated as total orders divided by number of unique customers who placed orders.
          Handles division by zero. Result is a single average value.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    COUNT(orders.order_id) / NULLIF(COUNT(DISTINCT orders.customer_id), 0) AS orders_per_customer
                FROM orders
              columns_used:
                - orders.order_id
                - orders.customer_id
      
      - name: product_line_revenue
        business_name: Product Line Revenue
        description: >-
          Total revenue by product calculated from order item line revenue.
          Use for product-level revenue analysis. Result grain: one row per product.
        return_type: currency_usd
        result_grain: one row per product
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    order_items.product_id,
                    SUM(order_items.line_revenue_usd) AS product_line_revenue
                FROM order_items
                GROUP BY order_items.product_id
              columns_used:
                - order_items.product_id
                - order_items.line_revenue_usd
      
      - name: product_line_cost
        business_name: Product Line Cost
        description: >-
          Total cost by product calculated from order item line cost.
          Use for product-level cost analysis. Result grain: one row per product.
        return_type: currency_usd
        result_grain: one row per product
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    order_items.product_id,
                    SUM(order_items.line_cost_usd) AS product_line_cost
                FROM order_items
                GROUP BY order_items.product_id
              columns_used:
                - order_items.product_id
                - order_items.line_cost_usd
      
      - name: product_line_profit
        business_name: Product Line Profit
        description: >-
          Total profit by product calculated as product line revenue minus product line cost.
          Result grain: one row per product.
        return_type: currency_usd
        result_grain: one row per product
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    order_items.product_id,
                    SUM(order_items.line_revenue_usd) - SUM(order_items.line_cost_usd) AS product_line_profit
                FROM order_items
                GROUP BY order_items.product_id
              columns_used:
                - order_items.product_id
                - order_items.line_revenue_usd
                - order_items.line_cost_usd
      
      - name: product_units_sold
        business_name: Product Units Sold
        description: >-
          Total units sold by product. Aggregates quantity from order_items.
          Result grain: one row per product.
        return_type: integer
        result_grain: one row per product
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    order_items.product_id,
                    SUM(order_items.quantity) AS product_units_sold
                FROM order_items
                GROUP BY order_items.product_id
              columns_used:
                - order_items.product_id
                - order_items.quantity
      
      - name: average_discount_pct
        business_name: Average Discount Percentage
        description: >-
          Average discount percentage across all order items weighted by line revenue.
          Calculated as total discount amount divided by total pre-discount revenue.
          Result is a single percentage value.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    SUM(order_items.quantity * order_items.unit_price_usd * order_items.discount_pct / 100.0)
                    / NULLIF(SUM(order_items.quantity * order_items.unit_price_usd), 0) * 100 AS average_discount_pct
                FROM order_items
              columns_used:
                - order_items.quantity
                - order_items.unit_price_usd
                - order_items.discount_pct
      
      - name: total_freight_cost
        business_name: Total Freight Cost
        description: >-
          Total freight cost in USD across all shipments. Aggregates shipment-level freight_cost_usd.
          Result is a single aggregated value.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    SUM(shipments.freight_cost_usd) AS total_freight_cost
                FROM shipments
              columns_used:
                - shipments.freight_cost_usd
      
      - name: shipment_count
        business_name: Shipment Count
        description: >-
          Total number of shipments. Counts distinct shipment_id values.
          Result is a single count value.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    COUNT(shipments.shipment_id) AS shipment_count
                FROM shipments
              columns_used:
                - shipments.shipment_id
      
      - name: units_shipped
        business_name: Units Shipped
        description: >-
          Total number of product units shipped across all shipment items.
          Sums quantity from shipment_items. Result is a single aggregated value.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    SUM(shipment_items.quantity) AS units_shipped
                FROM shipment_items
              columns_used:
                - shipment_items.quantity
      
      - name: average_delivery_delay_days
        business_name: Average Delivery Delay Days
        description: >-
          Average delivery delay in days calculated as the difference between actual arrival and expected arrival
          for completed shipments. Positive values indicate late delivery, negative values indicate early delivery.
          Only includes shipments with non-null actual_arrival. Result is a single average value.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    AVG(shipments.actual_arrival - shipments.expected_arrival) AS average_delivery_delay_days
                FROM shipments
                WHERE shipments.actual_arrival IS NOT NULL
              columns_used:
                - shipments.actual_arrival
                - shipments.expected_arrival
      
      - name: delayed_shipment_count
        business_name: Delayed Shipment Count
        description: >-
          Number of shipments that arrived later than expected.
          Counts shipments where actual_arrival > expected_arrival. Result is a single count value.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    COUNT(shipments.shipment_id) AS delayed_shipment_count
                FROM shipments
                WHERE shipments.actual_arrival IS NOT NULL
                  AND shipments.actual_arrival > shipments.expected_arrival
              columns_used:
                - shipments.shipment_id
                - shipments.actual_arrival
                - shipments.expected_arrival
      
      - name: on_time_delivery_pct
        business_name: On-Time Delivery Percentage
        description: >-
          Percentage of shipments delivered on or before expected arrival date.
          Calculated as count of on-time shipments divided by total completed shipments.
          Only includes shipments with non-null actual_arrival. Result is a single percentage value.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    SUM(CASE WHEN shipments.actual_arrival <= shipments.expected_arrival THEN 1 ELSE 0 END)
                    / NULLIF(COUNT(shipments.shipment_id), 0) * 100 AS on_time_delivery_pct
                FROM shipments
                WHERE shipments.actual_arrival IS NOT NULL
              columns_used:
                - shipments.shipment_id
                - shipments.actual_arrival
                - shipments.expected_arrival
      
      - name: returned_order_count
        business_name: Returned Order Count
        description: >-
          Number of orders that have been returned. Counts orders where is_returned = true.
          Result is a single count value.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    COUNT(orders.order_id) AS returned_order_count
                FROM orders
                WHERE orders.is_returned = 1
              columns_used:
                - orders.order_id
                - orders.is_returned
      
      - name: return_rate_pct
        business_name: Return Rate Percentage
        description: >-
          Percentage of orders that have been returned.
          Calculated as count of returned orders divided by total orders.
          Result is a single percentage value.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    SUM(CASE WHEN orders.is_returned = 1 THEN 1 ELSE 0 END)
                    / NULLIF(COUNT(orders.order_id), 0) * 100 AS return_rate_pct
                FROM orders
              columns_used:
                - orders.order_id
                - orders.is_returned
      
      - name: average_customer_rating
        business_name: Average Customer Rating
        description: >-
          Average customer rating across all rated orders.
          Only includes orders with non-null customer_rating. Result is a single average value.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    AVG(orders.customer_rating) AS average_customer_rating
                FROM orders
                WHERE orders.customer_rating IS NOT NULL
              columns_used:
                - orders.customer_rating
      
      - name: revenue_by_customer_segment
        business_name: Revenue By Customer Segment
        description: >-
          Total revenue by customer segment. Joins orders to customers to aggregate revenue by segment.
          Result grain: one row per customer segment.
        return_type: currency_usd
        result_grain: one row per customer segment
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    customers.customer_segment,
                    SUM(orders.total_amount_usd) AS revenue_by_segment
                FROM orders
                JOIN customers ON orders.customer_id = customers.customer_id
                GROUP BY customers.customer_segment
              columns_used:
                - orders.customer_id
                - orders.total_amount_usd
                - customers.customer_id
                - customers.customer_segment
      
      - name: revenue_by_order_channel
        business_name: Revenue By Order Channel
        description: >-
          Total revenue by order channel. Aggregates order revenue by channel.
          Result grain: one row per order channel.
        return_type: currency_usd
        result_grain: one row per order channel
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    orders.order_channel,
                    SUM(orders.total_amount_usd) AS revenue_by_channel
                FROM orders
                GROUP BY orders.order_channel
              columns_used:
                - orders.order_channel
                - orders.total_amount_usd
      
      - name: revenue_by_payment_method
        business_name: Revenue By Payment Method
        description: >-
          Total revenue by payment method. Aggregates order revenue by payment method.
          Result grain: one row per payment method.
        return_type: currency_usd
        result_grain: one row per payment method
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    orders.payment_method,
                    SUM(orders.total_amount_usd) AS revenue_by_payment_method
                FROM orders
                GROUP BY orders.payment_method
              columns_used:
                - orders.payment_method
                - orders.total_amount_usd
      
      - name: revenue_by_store
        business_name: Revenue By Store
        description: >-
          Total revenue by store. Aggregates order revenue by store.
          Result grain: one row per store.
        return_type: currency_usd
        result_grain: one row per store
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    orders.store_id,
                    SUM(orders.total_amount_usd) AS revenue_by_store
                FROM orders
                GROUP BY orders.store_id
              columns_used:
                - orders.store_id
                - orders.total_amount_usd
      
      - name: revenue_by_product_category
        business_name: Revenue By Product Category
        description: >-
          Total revenue by product category. Joins order_items to products to product_categories
          to aggregate line revenue by category. Result grain: one row per product category.
        return_type: currency_usd
        result_grain: one row per product category
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    products.category_id,
                    SUM(order_items.line_revenue_usd) AS revenue_by_category
                FROM order_items
                JOIN products ON order_items.product_id = products.product_id
                GROUP BY products.category_id
              columns_used:
                - order_items.product_id
                - order_items.line_revenue_usd
                - products.product_id
                - products.category_id
      
      - name: revenue_by_supplier
        business_name: Revenue By Supplier
        description: >-
          Total revenue by supplier. Joins order_items to products to aggregate line revenue by supplier.
          Result grain: one row per supplier.
        return_type: currency_usd
        result_grain: one row per supplier
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    products.supplier_id,
                    SUM(order_items.line_revenue_usd) AS revenue_by_supplier
                FROM order_items
                JOIN products ON order_items.product_id = products.product_id
                GROUP BY products.supplier_id
              columns_used:
                - order_items.product_id
                - order_items.line_revenue_usd
                - products.product_id
                - products.supplier_id
      
      - name: monthly_revenue
        business_name: Monthly Revenue
        description: >-
          Total revenue by month. Aggregates order revenue by month extracted from order_date.
          Uses TRUNC with 'MM' to extract month. Result grain: one row per month.
        return_type: currency_usd
        result_grain: one row per month
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    TRUNC(orders.order_date, 'MM') AS order_month,
                    SUM(orders.total_amount_usd) AS monthly_revenue
                FROM orders
                GROUP BY TRUNC(orders.order_date, 'MM')
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount_usd
      
      - name: monthly_order_count
        business_name: Monthly Order Count
        description: >-
          Total order count by month. Counts orders by month extracted from order_date.
          Uses TRUNC with 'MM' to extract month. Result grain: one row per month.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    TRUNC(orders.order_date, 'MM') AS order_month,
                    COUNT(orders.order_id) AS monthly_order_count
                FROM orders
                GROUP BY TRUNC(orders.order_date, 'MM')
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.order_id
      
      - name: revenue_rank_by_product
        business_name: Revenue Rank By Product
        description: >-
          Ranks products by total revenue in descending order. Uses RANK() window function.
          Result grain: one row per product with rank.
        return_type: integer
        result_grain: one row per product
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    order_items.product_id,
                    SUM(order_items.line_revenue_usd) AS product_revenue,
                    RANK() OVER (ORDER BY SUM(order_items.line_revenue_usd) DESC) AS revenue_rank
                FROM order_items
                GROUP BY order_items.product_id
              columns_used:
                - order_items.product_id
                - order_items.line_revenue_usd
      
      - name: revenue_rank_by_customer
        business_name: Revenue Rank By Customer
        description: >-
          Ranks customers by total revenue in descending order. Uses RANK() window function.
          Result grain: one row per customer with rank.
        return_type: integer
        result_grain: one row per customer
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    orders.customer_id,
                    SUM(orders.total_amount_usd) AS customer_revenue,
                    RANK() OVER (ORDER BY SUM(orders.total_amount_usd) DESC) AS revenue_rank
                FROM orders
                GROUP BY orders.customer_id
              columns_used:
                - orders.customer_id
                - orders.total_amount_usd
      
      - name: running_total_revenue
        business_name: Running Total Revenue
        description: >-
          Running total of revenue by order date. Uses SUM() OVER window function ordered by order date.
          Result grain: one row per order with cumulative revenue.
        return_type: currency_usd
        result_grain: one row per order
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    orders.order_id,
                    orders.order_date,
                    orders.total_amount_usd,
                    SUM(orders.total_amount_usd) OVER (ORDER BY orders.order_date ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS running_total_revenue
                FROM orders
                ORDER BY orders.order_date
              columns_used:
                - orders.order_id
                - orders.order_date
                - orders.total_amount_usd
      
      - name: supplier_reliability_weighted_avg
        business_name: Supplier Reliability Weighted Average
        description: >-
          Weighted average supplier reliability score weighted by number of products supplied.
          Result is a single weighted average value.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: ORACLE
              expression: |
                SELECT
                    SUM(suppliers.reliability_score * product_counts.product_count)
                    / NULLIF(SUM(product_counts.product_count), 0) AS weighted_avg_reliability
                FROM suppliers
                JOIN (
                    SELECT supplier_id, COUNT(product_id) AS product_count
                    FROM products
                    GROUP BY supplier_id
                ) product_counts ON suppliers.supplier_id = product_counts.supplier_id
              columns_used:
                - suppliers.supplier_id
                - suppliers.reliability_score
                - products.supplier_id
                - products.product_id